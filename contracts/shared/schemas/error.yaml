# Run `just shared-contracts` after bumping s99ab.
# contracts/schemas/error.yaml
#
# The one error shape every s99ab app returns, for every failing status.
# apierr marshals exactly this. Diverging breaks every generated client.

Error:
  type: object
  required: [code, message]
  additionalProperties: false
  properties:
    code:
      type: string
      pattern: '^[a-z][a-z0-9_]*$'
      description: >
        Stable machine-readable code. Clients branch on this, never on the
        message or the status. Never localised, never reworded.
      examples: [not_found, conflict, validation, unauthorized, internal]
    message:
      type: string
      description: >
        i18n key the client resolves. Never English prose - the server does not
        know the caller's language.
      examples: [error.notFound, session.nameTooShort]
    details:
      type: object
      description: >
        Field-level detail, keyed by field path. Present on validation errors,
        absent otherwise. Values are codes, not sentences.
      additionalProperties:
        type: string
      examples:
        - name: too_short
          email: invalid_format
