openapi: 3.1.0
info:
  title: Goptivum Server API
  description: |
    The contract between Goptivum Desktop and Goptivum Server. A plan is a document, not rows: the desktop downloads one whole, edits it in memory and uploads a new version, so there is no per-entity endpoint here and no partial update.
  version: 0.1.0
  license:
    name: MIT
    url: https://opensource.org/license/mit/
servers:
  - url: /api
    description: |
      Every path below is relative to it. /info is unversioned, because a client reads it to learn the version; everything else carries its version in the path.
security:
  - sessionToken: []
tags:
  - name: discovery
    description: What a client reads before it has a session or knows the version.
  - name: plans
    description: |
      The school's plans. A plan is one project: every signed-in account reads and forks every one, and only its owner changes it.
  - name: trash
    description: |
      What an owner deleted, kept for the server's `trash_days` and restorable until then. Each account's Trash holds only what it owns.
  - name: versions
    description: One plan's timeline of documents.
  - name: results
    description: The timetables a plan's solves kept, each a whole document.
  - name: check
    description: What a solve's input checks say about a version or a result, without solving it.
  - name: rules
    description: |
      The rules a plan may set, as the solver defines them, and the rule profiles the school shares.
  - name: import
    description: Turning a school's own file into a plan.
  - name: export
    description: |
      A version or a result as a file for someone else: a .gpf or an Optivum HTML export, built once and kept.
  - name: account
    description: |
      What one signed-in account keeps on the server for itself: how its Library is arranged.
  - name: users
    description: The school's accounts and their sessions. Administrator-only.
  - name: security
    description: |
      How signing in is protected: the sign-in lockout and Kratos's password rules. Administrator-only.
  - name: nodes
    description: The solving nodes this deployment trusts. Administrator-only.
  - name: jobs
    description: Solves dispatched to a node, and their progress.
  - name: school
    description: |
      What belongs to the school rather than to one person: its own key for encrypted project files.
  - name: server
    description: |
      The settings an administrator changes while the server runs. Administrator-only.
  - name: health
    description: |
      What the server is and whether it can serve. No session needed.
  - name: storage
    description: |
      What every project stores, and emptying Trash, trimming backups and deleting unused objects now. Administrator-only.
  - name: logs
    description: The server's recent log lines. Administrator-only.
  - name: audit
    description: |
      Who changed which project, account, node or setting. Administrator-only.
paths:
  /info:
    get:
      operationId: getInfo
      summary: Identify the server and the API version it serves.
      description: |
        Answers with no session and with every dependency stopped: it reads compiled-in values and never touches the database, object storage or Kratos. A client checks four things in order, and each failure has its own message: whether it answered at all, whether product is goptivum, whether the client supports api_version, and whether the client is at or above min_client_version.
      tags:
        - discovery
      security: []
      responses:
        '200':
          description: The server's identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Info'
  /v1/plans:
    get:
      operationId: listPlans
      summary: List the school's plans.
      description: |
        Every live plan of every owner, newest first; `can_edit` says which are the caller's to change. Plans in Trash are not listed. Free-text search covers the plan name and the school year. The owners' names come from Kratos; when it does not answer, the plans are listed without them.
      tags:
        - plans
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Query'
      responses:
        '200':
          description: A page of plans.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: createPlan
      summary: Create a plan with its first version.
      description: |
        The plan and its version 1 are stored in one transaction, so no plan exists with nothing to open. Without a document, version 1 is an empty school named after the plan: it has no week yet, so it cannot be checked or solved until one is added. With a document, version 1 is that document as it was sent. The body goes through the upload size limit, not the JSON one.
      tags:
        - plans
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: |
                    Trimmed. Blank is refused with `name: required`, longer than 200 letters with `name: too_long`.
                school_year:
                  type: string
                  maxLength: 32
                  description: |
                    Trimmed. Absent means none. Longer than 32 letters is refused with `school_year: too_long`.
                document:
                  type: string
                  format: binary
                  description: |
                    An encoded document, the same bytes a download returns. Absent means an empty school.
      responses:
        '201':
          description: The plan. Its version 1 exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/plans/demo:
    post:
      operationId: createDemoPlan
      summary: Create a plan from Arrango's demo school. Development only.
      description: |
        Registered only when the server's configuration sets `dev.demo_school`; otherwise the route does not exist and answers 404. Asks the first paired, unrevoked node for its synthetic production-sized school (about 1272 lessons, no timetable) and stores it as version 1 of a new plan with the name and school year given here.
      tags:
        - plans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanCreate'
      responses:
        '201':
          description: The plan. Its version 1 is the demo school.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            No node can give the school: none is paired, every one is revoked, or the first one did not answer. Message `solve.nodeUnavailable`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/plans/{planId}:
    parameters:
      - $ref: '#/components/parameters/PlanID'
    get:
      operationId: getPlan
      summary: Read one plan.
      description: Any signed-in account reads any live plan. A plan in Trash is not found.
      tags:
        - plans
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      operationId: updatePlan
      summary: Rename a plan or change its school year.
      description: |
        A field that is absent is left as it is, so a body with neither changes nothing. The name is trimmed and a blank one is refused with `name: required`. A change moves `updated_at`. The owner's only: anyone else gets 403 `plans.notYours`.
      tags:
        - plans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanUpdate'
      responses:
        '200':
          description: The plan as it now is.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      operationId: deletePlan
      summary: Move a plan to Trash.
      description: |
        The plan's running solves are cancelled first, and the answer waits until their jobs are closed, which can take ten seconds plus storing the timetable a cancelled solve had found. Then the plan moves to Trash with its versions and jobs: every route answers 404 for it except the Trash listing and restore. It is removed for good the server's `trash_days` after the deletion. The owner's only: anyone else gets 403 `plans.notYours`.
      tags:
        - plans
      responses:
        '204':
          description: In Trash.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/plans/{planId}/restore:
    parameters:
      - $ref: '#/components/parameters/PlanID'
    post:
      operationId: restorePlan
      summary: Take a plan out of Trash.
      description: |
        The plan comes back with its versions and jobs. Restoring a plan that is not in Trash changes nothing and answers the plan, so an undo that runs twice lands where one did. A plan removed for good is not found. The owner's only: anyone else gets 403 `plans.notYours`.
      tags:
        - trash
      responses:
        '200':
          description: The plan, live again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/plans/{planId}/fork:
    parameters:
      - $ref: '#/components/parameters/PlanID'
    post:
      operationId: forkPlan
      summary: Make an own copy of a plan.
      description: |
        Any signed-in account copies any live plan: a fork of another account's plan, or a duplicate of its own. The copy is a new plan the caller owns, with the origin's school year and one version: the origin's chosen version (the newest when none is named) as its version 1, with that version's validity dates. Nothing else is copied: no older versions, checkpoints, results, solves or caps. `origin` records the plan and version it came from. A plan in Trash, or a version the plan does not have, is not found.
      tags:
        - plans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanFork'
      responses:
        '201':
          description: The copy. Its version 1 exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/plans/{planId}/owner:
    parameters:
      - $ref: '#/components/parameters/PlanID'
    put:
      operationId: transferPlan
      summary: Give a plan to another account. Administrator-only.
      description: |
        The account named becomes the plan's owner: from then on only it edits, deletes and solves the plan, and the previous owner reads it like everyone else. The plan's results, checkpoints and Trash items go with it; solves already running go on. Giving a plan to its owner changes nothing. The change is written to the audit trail as `project.transferred`. A plan in Trash is not found. A signed-in account that is not an administrator gets 404, as for every administrator route.
      tags:
        - plans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanTransfer'
      responses:
        '200':
          description: The plan with its new owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/plans/{planId}/versions:
    parameters:
      - $ref: '#/components/parameters/PlanID'
    get:
      operationId: listVersions
      summary: The plan's version timeline, oldest first.
      description: |
        Version 1 is created with the plan. The newest version is the plan's main file; the older ones are its backups, and a named one is a checkpoint. The backups cap removes the oldest plain versions for good, so the numbering has gaps.
      tags:
        - versions
      responses:
        '200':
          description: Every version of the plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: uploadVersion
      summary: Upload a new version of the plan's document.
      description: |
        There is no lock. The upload names the version it was derived from, and a parent that is no longer the newest is refused with a conflict carrying the current version. Every plan is created with version 1, so the first upload makes version 2. The document itself is the encoded school: protobuf compressed with zstd, the same bytes a download returns.
        Each upload carries an `upload_key` the client chose. An upload whose key this plan already stored is answered with that version, 201 as the first time, so a retry after a lost answer never looks like a conflict. The same key with a different document or parent is refused with `upload_key: reused`.
        After a new version lands, the oldest versions beyond the plan's backups cap are removed for good: the cap counts the versions below the newest that are not checkpoints (see `Plan.backups_keep`).
        The plan owner's only: anyone else gets 403 `plans.notYours` and may fork the plan instead.
      tags:
        - versions
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VersionUpload'
            encoding:
              summary:
                contentType: application/json
      responses:
        '201':
          description: The version that landed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The parent is not the current version. Someone saved first. Message `plans.versionConflict`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/plans/{planId}/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/PlanID'
      - $ref: '#/components/parameters/VersionNumber'
    get:
      operationId: downloadVersion
      summary: Download one version's document.
      description: |
        The stored bytes, unchanged: protobuf compressed with zstd. The desktop downloads a document whole, edits it in memory and uploads a new version; there is no per-entity API and no partial update.
      tags:
        - versions
      responses:
        '200':
          description: The document.
          content:
            application/zstd:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/plans/{planId}/versions/{version}/check:
    parameters:
      - $ref: '#/components/parameters/PlanID'
      - $ref: '#/components/parameters/VersionNumber'
      - $ref: '#/components/parameters/RulesVersion'
    get:
      operationId: checkVersion
      summary: What a solve's input checks say about one version.
      description: |
        The first paired, unrevoked node checks the version's school and, when the version's timetable places every lesson, validates and rates that timetable too. Nothing is solved and nothing is stored in the plan.
        A result is cached by the version's stored object, so versions with identical documents, in any plan, share one result and a repeated check answers without asking the node.
        At most one check per plan runs at a time. A check of a newer version stops the one running for an older version, which then answers 409 `check.superseded`; a check asked for an older version while a newer one runs answers the same at once. A check of the same document as the one running waits for that one's result.
        When `rules_version` is supplied, only the rule configuration of that version in the same plan replaces the checked document's rules. Compare sends one captured main-file version for both sides. The cache includes these rules.
        The node runs each check in a child process that waits, without saying so, until the node has memory for it. The check gives up after 20 s, dialling included, and answers 504 `check.waitingForSolver`.
      tags:
        - check
      responses:
        '200':
          description: The findings, the counts and, for a rated timetable, its scores.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Check'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            No check ran. Message `solve.nodeUnavailable`: no node is paired and unrevoked, the node did not answer, or it has no room for a check. Message `node.outdated`: the node answers but cannot check (details `Capability: check`); it needs an update. Message `check.superseded`: a check of a newer version of this plan replaced this one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          description: |
            The node did not answer within 20 s, usually because it is waiting for memory to start the check. Message `check.waitingForSolver`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/plans/{planId}/versions/{version}/checkpoint:
    parameters:
      - $ref: '#/components/parameters/PlanID'
      - $ref: '#/components/parameters/VersionNumber'
    put:
      operationId: nameCheckpoint
      summary: Name a version as a checkpoint, or rename one.
      description: |
        A checkpoint is a named version. The backups cap never removes it, so it stays in Backups/ beside the newest versions. Naming a version whose checkpoint is in Trash takes it out of Trash under the new name. The plan owner's only: anyone else gets 403 `plans.notYours`.
      tags:
        - versions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckpointName'
      responses:
        '200':
          description: The version, named.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      operationId: deleteCheckpoint
      summary: Move a checkpoint to Trash.
      description: |
        The version keeps its name in Trash and listVersions lists it as a plain version. The backups cap does not remove it while the checkpoint is in Trash, so restoreCheckpoint brings back the same document. Once the server's `trash_days` have passed the name goes, and the version is removed with the other backups beyond the cap. A version that is not a live checkpoint is not found. The plan owner's only: anyone else gets 403 `plans.notYours`.
      tags:
        - versions
      responses:
        '204':
          description: In Trash.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/plans/{planId}/versions/{version}/checkpoint/restore:
    parameters:
      - $ref: '#/components/parameters/PlanID'
      - $ref: '#/components/parameters/VersionNumber'
    post:
      operationId: restoreCheckpoint
      summary: Take a checkpoint out of Trash.
      description: |
        The version is named again with the name it had. Restoring a checkpoint that is not in Trash changes nothing and answers the version, so an undo that runs twice lands where one did. A version that is no checkpoint, or whose checkpoint was removed for good, is not found. The plan owner's only: anyone else gets 403 `plans.notYours`.
      tags:
        - trash
      responses:
        '200':
          description: The version, named again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/plans/{planId}/versions/{version}/export/{format}:
    parameters:
      - $ref: '#/components/parameters/PlanID'
      - $ref: '#/components/parameters/VersionNumber'
      - $ref: '#/components/parameters/ExportFormat'
    get:
      operationId: exportVersion
      summary: One version as a file in the named format.
      description: |
        The file is built on the first request and kept, so a second request for the same source and format answers from storage without building again. A `.gpf` is encrypted to the school's own key when the server holds one (Identity mode: any of the school's machines opens it, nobody else), and plain when it holds none; a kept file built for another key, or plain before the school had one, is built again. `optivum.html` is a zip of index.html and one page per class, teacher and room. A version whose document holds no timetable has no HTML export: 422 `export.noTimetable`. When the plan is deleted for good, or the version or result leaves through a cap or the Trash purge, its files go with it: the object sweep deletes them after its hour.
      tags:
        - export
      responses:
        '200':
          description: |
            The file. `application/octet-stream` for `goptivum.gpf`, `application/zip` for `optivum.html`.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/zip:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/plans/{planId}/results:
    parameters:
      - $ref: '#/components/parameters/PlanID'
    get:
      operationId: listResults
      summary: The plan's results, newest first.
      description: |
        Every result a solve of this plan kept and nobody deleted. The plan's results cap (`Plan.results_keep`) keeps the pinned ones and the newest unpinned ones; each new result removes the oldest unpinned ones beyond it for good. Results in Trash are not listed.
      tags:
        - results
      responses:
        '200':
          description: The plan's results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolveResultList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: uploadResult
      summary: Keep a timetable solved on a device as a result of the plan.
      description: |
        A desktop that solved on its own Arrango node, for example while it could not reach this server, sends the result it kept: the whole document (the school data it solved plus the timetable, the same bytes a download returns), the version its school data came from, what the node said about the timetable, the rule profile the solve used, and the device's name. It becomes a result like one a server solve keeps, with no job, `device` set and the caller as `started_by`.
        The results cap counts it like any other result, by `created_at`, which is `solved_at` when sent: a result older than the plan's newest `results_keep` unpinned ones is removed by the cap at once, and the answer still describes it.
        Each upload carries an `upload_key` the device chose. An upload whose key this plan already stored is answered with that result, 201 as the first time, so a retry after a lost answer keeps one result. The same key with a different document or source version is refused with `upload_key: reused`.
        The plan owner's only: anyone else gets 403 `plans.notYours`.
      tags:
        - results
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SolveResultUpload'
            encoding:
              rule_profile:
                contentType: application/json
      responses:
        '201':
          description: The result as it was kept.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolveResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/plans/{planId}/results/{resultId}:
    parameters:
      - $ref: '#/components/parameters/PlanID'
      - $ref: '#/components/parameters/ResultID'
    get:
      operationId: downloadResult
      summary: Download one result's document.
      description: |
        The stored bytes, unchanged: protobuf compressed with zstd, the same format as downloadVersion. The document holds the school data of the version the solve read and the timetable it found.
      tags:
        - results
      responses:
        '200':
          description: The document.
          content:
            application/zstd:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      operationId: updateResult
      summary: Name, rename or pin a result.
      description: |
        The plan owner's only: anyone else gets 403 `plans.notYours`.
      tags:
        - results
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolveResultUpdate'
      responses:
        '200':
          description: The result as it now is.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolveResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      operationId: deleteResult
      summary: Move a result to Trash.
      description: |
        It stays in Trash for the server's `trash_days` and restoreResult brings it back, pinned or not as it was. The results cap does not count or remove a result in Trash. A result already in Trash is not found. The plan owner's only: anyone else gets 403 `plans.notYours`.
      tags:
        - results
      responses:
        '204':
          description: In Trash.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/plans/{planId}/results/{resultId}/restore:
    parameters:
      - $ref: '#/components/parameters/PlanID'
      - $ref: '#/components/parameters/ResultID'
    post:
      operationId: restoreResult
      summary: Take a result out of Trash.
      description: |
        Restoring a result that is not in Trash changes nothing and answers the result, so an undo that runs twice lands where one did. A result removed for good is not found. The plan owner's only: anyone else gets 403 `plans.notYours`.
      tags:
        - trash
      responses:
        '200':
          description: The result, listed again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolveResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/plans/{planId}/results/{resultId}/check:
    parameters:
      - $ref: '#/components/parameters/PlanID'
      - $ref: '#/components/parameters/ResultID'
      - $ref: '#/components/parameters/RulesVersion'
    get:
      operationId: checkResult
      summary: What a solve's input checks say about one result.
      description: |
        The same check as checkVersion, over the result's own document: its school data and its timetable, not the plan's main file. A result solved with a rule profile is judged by that profile's rules as the solve was sent them: the model with an empty `rule_config` and the profile as the request's; its document keeps the plan's own rules. The answer is cached by the result's stored object and the rules sent, and a check of a result never replaces a running check of a version or of another result. When `rules_version` is supplied, the rule configuration of that version in the same plan replaces both the saved profile and document rules. Compare sends the same main-file version for both sides. The same node, capacity and 20 s limits apply.
      tags:
        - check
      responses:
        '200':
          description: The findings, the counts and, for a rated timetable, its scores.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Check'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            No check ran. Message `solve.nodeUnavailable` or `node.outdated`, as on checkVersion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          description: |
            The node did not answer within 20 s. Message `check.waitingForSolver`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/plans/{planId}/results/{resultId}/export/{format}:
    parameters:
      - $ref: '#/components/parameters/PlanID'
      - $ref: '#/components/parameters/ResultID'
      - $ref: '#/components/parameters/ExportFormat'
    get:
      operationId: exportResult
      summary: One result as a file in the named format.
      description: |
        The file is built on the first request and kept, so a second request for the same source and format answers from storage without building again. A `.gpf` is encrypted to the school's own key when the server holds one (Identity mode: any of the school's machines opens it, nobody else), and plain when it holds none; a kept file built for another key, or plain before the school had one, is built again. `optivum.html` is a zip of index.html and one page per class, teacher and room. A version whose document holds no timetable has no HTML export: 422 `export.noTimetable`. When the plan is deleted for good, or the version or result leaves through a cap or the Trash purge, its files go with it: the object sweep deletes them after its hour.
      tags:
        - export
      responses:
        '200':
          description: |
            The file. `application/octet-stream` for `goptivum.gpf`, `application/zip` for `optivum.html`.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/zip:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/rules:
    get:
      operationId: getRuleCatalogue
      summary: Every rule a plan may set, and the built-in rule profiles.
      description: |
        Asked of the first paired, unrevoked node each time; nothing is stored and nothing is cached here. The node answers from its own build, so a node update can change the list.
        The node answers in a child process that waits, without saying so, until the node has memory for it. The call gives up after 20 s, dialling included, and answers 504 `rules.waitingForSolver`.
      tags:
        - rules
      responses:
        '200':
          description: The rules in the solver's table order, then the built-in profiles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleCatalogue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            No node answered. Message `solve.nodeUnavailable`: no node is paired and unrevoked, the node did not answer, or it has no room for the call. Message `node.outdated`: the node answers but cannot list its rules (details `Capability: rule_catalogue`); it needs an update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          description: |
            The node did not answer within 20 s, usually because it is waiting for memory to start the call. Message `rules.waitingForSolver`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/rules/profiles:
    get:
      operationId: listRuleProfiles
      summary: The school's own rule profiles, oldest first.
      description: |
        Every school profile, whoever created it: the school shares them. The built-in profiles are not listed here; getRuleCatalogue lists them, and no route changes them.
      tags:
        - rules
      responses:
        '200':
          description: The school's profiles, oldest first, so renaming one does not move it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolRuleProfileList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: createRuleProfile
      summary: Create a school rule profile.
      description: |
        Anyone signed in may create one; it is shared with the whole school at once. A copy of a built-in profile sends that profile's overrides. The rules are checked for their shape only: a rule the solver does not know, or hard on a rule that cannot be hard, is refused by the node when a solve or a check uses the profile.
        422 `error.validation` details: `name: required`, `name: too_long` (over 200 letters), `name: taken` (another school profile has this name after trimming), `overrides: required` (the list is absent; send `[]` for the solver's defaults), `overrides: too_many` (over 64), `overrides: invalid` (a rule key, mode, weight or param outside its schema), `overrides: duplicate` (one rule named twice).
      tags:
        - rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolRuleProfileCreate'
      responses:
        '201':
          description: The profile as stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolRuleProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/rules/profiles/{profileId}:
    parameters:
      - $ref: '#/components/parameters/RuleProfileID'
    patch:
      operationId: updateRuleProfile
      summary: Rename a school rule profile or replace its rules.
      description: |
        Only the account that created the profile and administrators may change it; anyone else gets 403 `rules.profileNotYours`. The last write wins. A solve already started keeps the rules it was sent, and its job and result keep the name the profile had then. 422 details as on createRuleProfile.
      tags:
        - rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolRuleProfileUpdate'
      responses:
        '200':
          description: The profile as it now is.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolRuleProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      operationId: deleteRuleProfile
      summary: Delete a school rule profile for good.
      description: |
        Only the account that created the profile and administrators may delete it; anyone else gets 403 `rules.profileNotYours`. There is no Trash for profiles. Jobs and results solved with it keep its name and the rules they were sent, so their checks still judge them the same way.
      tags:
        - rules
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/trash:
    get:
      operationId: listTrash
      summary: List what the caller has in Trash.
      description: |
        Only the caller's own: the plans it owns, and the checkpoints and results of live plans it owns; an administrator sees every owner's in Backend > Storage. Most recently deleted first. Each item says what kind of thing it is, when it was deleted and when it is removed for good; an item of kind `project` is restored with restorePlan, one of kind `checkpoint` with restoreCheckpoint, one of kind `result` (which carries the result) with restoreResult. Checkpoints and results of a plan in Trash are not listed: they are inside the project item.
      tags:
        - trash
      responses:
        '200':
          description: Everything in the caller's Trash.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/changes:
    get:
      operationId: listChanges
      summary: Which projects changed since a point.
      description: |
        The desktop keeps a copy of every project the account can open and polls this, about every 30 seconds, to learn which ones to read again. Every signed-in account reads every project's changes, as it reads every live project; an answer names plans by id only.
        Start without `since`: the answer has `reset` true, a `cursor` and no plans. Keep the cursor first, then read everything (listPlans, and for each plan getPlan, listVersions, listResults), then poll with `since` set to the cursor. Each answer's `cursor` is the point to ask from next.
        Each plan that changed after the point is listed once, however often it changed, with the parts to read again: `project` (getPlan), `versions` (listVersions), `results` (listResults). `state` is where the plan is now. A poll where nothing changed reads one row, so polling every 30 seconds costs next to nothing.
        `reset` true on a later poll means the point is not one this server's database handed out, for example because the database was made again: read everything again, then poll from the new cursor. `more` true means further changes wait: ask again at once from the new cursor. One answer covers at most 500 changed parts.
      tags:
        - plans
      parameters:
        - name: since
          in: query
          required: false
          description: |
            A `cursor` this route answered with. Absent means the caller has nothing yet. It is opaque: send it back as it came. Anything else is 422 `error.validation` with details `since: invalid`.
          schema:
            type: string
            maxLength: 64
      responses:
        '200':
          description: The plans that changed after the point.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/import:
    post:
      operationId: importPlan
      summary: Import a school file as a new plan.
      description: |
        Detection is by content, never by extension: a .zip could be anything and a .pla is recognisable by its own header. The winning importer maps what it can and returns the school plus typed findings for what it did not, because a file that fails wholesale teaches a secretary nothing. The imported school is stored as the plan's first version, in one transaction with the plan, and the plan is the caller's own. It reads the file exactly as previewImport does, so what the preview showed is what is stored.
        Without a `name`, the plan is named after the school the file names, or else after the uploaded file name without its extension, cut to 200 letters.
        A file that cannot be imported is 422: `error.validation` with `file: required | unreadable`, `passphrase: too_long`, `name: too_long` or `school_year: too_long`, or a `gpf.*` key with its parameters for a .gpf that does not open (`gpf.passwordRequired`, `gpf.wrongPassword`, `gpf.identityRequired`, `gpf.wrongRealm` and the rest of the gpf catalogue).
      tags:
        - import
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    The school's own file, as they have it: a .pla, a .gpf, an Optivum HTML export zipped whole, or one o*.html page of it (which imports that one class).
                passphrase:
                  type: string
                  maxLength: 1024
                  description: |
                    Opens a .gpf locked with a password. Only the importer that claimed the file sees it, and it is never stored or logged. Absent or empty means none: a password-locked file is then refused with `gpf.passwordRequired`, a wrong one with `gpf.wrongPassword`. Ignored for every other file. Longer than 1024 letters is refused with `passphrase: too_long`.
                name:
                  type: string
                  maxLength: 200
                  description: |
                    The plan name. Absent or blank means the school's name the file carries, else the uploaded file name without its extension.
                school_year:
                  type: string
                  maxLength: 32
      responses:
        '201':
          description: The plan, its first version, and what did not map.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedFormat'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/import/preview:
    post:
      operationId: previewImport
      summary: Read a school file the way an import would, and store nothing.
      description: |
        A dry run of importPlan: the same detection, the same importer and the same findings, and nothing is stored, stamped or audited. It answers what the file holds, so a person confirms before a plan exists. The confirming importPlan sends the same file again.
        Refused exactly as importPlan refuses: 415 `import.unsupportedFormat`, 422 `error.validation` with `file: required | unreadable` or `passphrase: too_long`, or a `gpf.*` key.
      tags:
        - import
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: The file importPlan would take.
                passphrase:
                  type: string
                  maxLength: 1024
                  description: |
                    As on importPlan: opens a password-locked .gpf, is never stored or logged, and is ignored for every other file.
      responses:
        '200':
          description: What the file holds and what did not map.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedFormat'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/account/library:
    get:
      operationId: getAccountLibrary
      summary: How the signed-in account arranges its Library.
      description: |
        Folders of projects, their order, pins and Recent, kept per account so every window and device the account signs in on shows one arrangement. An account that never saved one answers version 0 with every list empty. A project removed for good is left out of the answer; one in Trash stays, so restoring it, or undoing its delete, puts it back in its folder, place and pin. The desktop shows only the projects it lists.
      tags:
        - account
      responses:
        '200':
          description: The account's arrangement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLibrary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      operationId: saveAccountLibrary
      summary: Replace the signed-in account's Library arrangement.
      description: |
        The whole arrangement, carrying the `version` it was read at. A version that is not the stored one is refused with 409, which carries the arrangement as stored now, so two windows of one account never overwrite each other: the client applies its change to that one and saves again. A save whose answer was lost and is sent again meets its own arrangement in that 409.
        Deleting a folder is a save without it. Its projects stay: they go where the save places them, and to the top level when it places them nowhere. Its subfolders need a parent the save still has.
        A save may name a project that is gone for good by then; it is stored as sent and left out of every answer, including this one.
        Refused with 422 `error.validation`, the field and the code in `details`: `version: invalid` (below 0); `folders: too_many` (over 500); `folders.id: invalid` or `duplicate`; `folders.name: required` or `too_long` (over 200 letters, after trimming); `folders.accent: invalid`; `folders.parent_id: unknown` (no such folder), `cycle`, or `too_deep` (more than 8 folders deep); `projects`, `folders.projects`, `pinned` or `recent: invalid` (not a project id); `projects: duplicate` (a project placed twice: it sits in one folder or in the top level's list, at most once); `pinned: duplicate`; `recent: duplicate` or `too_many` (over 20); `projects: too_many` (over 5000 projects named in all); `body: too_large` (the arrangement over 256 KiB as stored).
      tags:
        - account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountLibrary'
      responses:
        '200':
          description: The arrangement now stored, with its new version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLibrary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            The version sent is not the stored one: another window or device saved first. Message `account.libraryConflict`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLibraryConflict'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/users:
    get:
      operationId: listUsers
      summary: List the school's accounts.
      description: |
        Every account, newest first, paged here rather than in Kratos: Kratos has no filter for a trait, so the listing is read whole.
      tags:
        - users
      parameters:
        - name: q
          in: query
          required: false
          description: |
            Only accounts whose username, email or name contains this text, ignoring case and the spaces around it. Absent or blank lists every account. `total` counts the matches.
          schema:
            type: string
            maxLength: 320
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: createUser
      summary: Create an account with a generated password.
      description: |
        Self-service registration is disabled, so this is the only way an account comes into being. The password is generated and returned once; it is held nowhere afterwards and the account must change it at the first sign-in.
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: The account, and its password, once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            An account already signs in with this username or email. Message `users.alreadyExists`. Both are sign-in names and compared ignoring case, the way Kratos compares them. Detail `Field` is `username` or `email` when the server found which one is taken; it is absent when Kratos refused a clash the server did not see first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserID'
    get:
      operationId: getUser
      summary: Read one account.
      tags:
        - users
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      operationId: updateUser
      summary: Set an account's role, or disable and re-enable it.
      description: |
        A partial update, so traits are left alone. Disabling stops the account signing in and keeps the credential, which is what makes re-enabling free. Disabling also signs the account out everywhere: every session it holds is ended before this answers.
        A change that would leave the school without an active administrator is refused as a whole and changes nothing: demoting or disabling the last account that is both an administrator and enabled.
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: The account as it now is.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Nothing was changed: the school would have no enabled administrator left. Message `users.lastAdmin`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/users/{userId}/password:
    parameters:
      - $ref: '#/components/parameters/UserID'
    post:
      operationId: resetUserPassword
      summary: Replace an account's password with a generated one.
      description: |
        Answers with the new password once. It is a full replace of the identity rather than a patch of the password field, because patching that field answers 200 and leaves the account unable to sign in with either the old password or the new one. Every session the account holds is ended before this answers, so the old password stops working everywhere at once.
      tags:
        - users
      responses:
        '200':
          description: The new password, once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordReset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/users/{userId}/sessions:
    parameters:
      - $ref: '#/components/parameters/UserID'
    get:
      operationId: listUserSessions
      summary: The sessions an account is signed in with.
      description: |
        Read from Kratos's admin API. Only sessions that still sign the account in are listed: an ended or expired session is left out, and so is every session of a disabled account.
      tags:
        - users
      responses:
        '200':
          description: The account's live sessions, newest sign-in first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSessionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      operationId: revokeUserSessions
      summary: Sign an account out everywhere.
      description: |
        Ends every session the account holds, through Kratos's admin API. The account can sign in again at once; disable it to stop that. Used on the caller's own account, this ends the caller's session too.
      tags:
        - users
      responses:
        '204':
          description: Every session is ended.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/users/{userId}/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/UserID'
      - $ref: '#/components/parameters/SessionID'
    delete:
      operationId: revokeUserSession
      summary: Sign an account out of one session.
      description: |
        Ends one session through Kratos's admin API. A session that belongs to another account, or does not exist, is 404.
      tags:
        - users
      responses:
        '204':
          description: The session is ended.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/security/lockout:
    get:
      operationId: getLockout
      summary: How failed sign-ins lock an account or an address out.
      description: |
        The server's /kratos proxy counts failed sign-ins twice: per sign-in name, whether or not an account has it, and per client address. A name or an address that reaches its limit is blocked for `block_minutes`; a successful sign-in clears its name's count. A blocked sign-in is not passed to Kratos and answers 429 with code `rate_limited`, message `auth.signInBlocked` and detail `Seconds`, the whole seconds left, plus a Retry-After header. The answer is the same for a name no account has, so the block says nothing about which accounts exist. Counts and blocks live in the server's memory and a restart clears them.
      tags:
        - security
      responses:
        '200':
          description: The limits in force.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lockout'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      operationId: updateLockout
      summary: Change the sign-in lockout limits.
      description: |
        Stored in the settings file beside the server's configuration file and checked against the same schema before it is written. An absent field is left as it is. `applies` in the answer says when the change takes effect. A block already running keeps the length it started with.
      tags:
        - security
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LockoutUpdate'
      responses:
        '200':
          description: The limits now in force.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lockout'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/security/password-rules:
    get:
      operationId: getPasswordRules
      summary: The password rules Kratos enforces, read-only.
      description: |
        Read from the Kratos configuration file named by `identity.kratos_config`, with Kratos's own defaults for what it leaves out. Kratos offers no way to read or change these while it runs, so they are shown and never set here. `known` is false when no file is named or it cannot be read; the server's log says why.
      tags:
        - security
      responses:
        '200':
          description: The rules, or a statement that they are not known.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordRules'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/nodes:
    get:
      operationId: listNodes
      summary: List the solving nodes this deployment has paired with.
      description: Revoked nodes included, so an operator can see what was removed.
      tags:
        - nodes
      responses:
        '200':
          description: Every node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: pairNode
      summary: Pair with a node from the URI it printed.
      description: |
        The server verifies the certificate the address presents against the fingerprint in the URI before the one-time token travels, so an impostor at that address learns nothing, not even that a token existed. Pairing a node already on the list updates its address and clears a revocation rather than adding a second entry, because the fingerprint is the identity: the node keeps its id, and its name when the request gives none.
        A new node's limits start at the node's own ceilings for this server (its `max_concurrent_solves`, or 1 when it sets none, and 4 workers per solve, lower when its worker ceiling is lower). Pairing an existing node again keeps its limits and lowers any above the node's ceilings.
        A refusal is 422 with one of these messages: `node.notALink` (the text is not an arrango:// pairing link), `node.unreachable` (nothing answered at its address), `node.fingerprintMismatch` (the address presented another certificate than the link names), `node.linkSpent` (the node refused the link: expired, already used or never issued, which the node answers alike on purpose), `node.clientTooOld` (the node needs a newer version of this server), `node.pairingFailed` (the node answered with any other error).
      tags:
        - nodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodePair'
      responses:
        '201':
          description: The node, and the versions it reported while pairing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodePaired'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/nodes/{nodeId}:
    parameters:
      - $ref: '#/components/parameters/NodeID'
    get:
      operationId: getNode
      summary: Read one node.
      tags:
        - nodes
      responses:
        '200':
          description: The node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      operationId: updateNode
      summary: Rename a node or set this server's limits on it.
      description: |
        An absent field is left as it is. The name is local and needs no call to the node. A limit is checked against the node's own ceiling for this server, read from the node now, because a limit above it would queue a solve on the node instead of refusing it here: 422 `node.solvesAboveCeiling` or `node.workersAboveCeiling` with detail `Ceiling`. When the node's ceiling cannot be read the limits are not changed: 409 with the reason as the message (`node.unreachable`, `node.fingerprintMismatch`, `node.notPaired`, `node.clientTooOld`), `node.outdated` (detail `Capability: peer_policy`) for a node whose build does not report its ceilings, or `node.revoked`. 422 `error.validation` covers a blank or too long `label` (`required`, `too_long`), a limit outside 1 to 64 (`invalid`) and a body with no field (`body: empty`).
      tags:
        - nodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeUpdate'
      responses:
        '200':
          description: The node as it now is.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The node's ceilings could not be read, so no limit was changed. The message says why; see the operation's description.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      operationId: revokeNode
      summary: Stop dispatching to a node.
      description: |
        One side only. The node forgets this deployment when an operator revokes it there, and revocation there is deleting a line. The row is kept rather than removed, so a job that names a revoked node still reads.
        No new solve is admitted on the node once this starts. Its running solves are cancelled and this answers once their jobs are closed, each keeping the best timetable it had as a result, the same as a stop.
      tags:
        - nodes
      responses:
        '204':
          description: Revoked, or already revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/nodes/{nodeId}/status:
    parameters:
      - $ref: '#/components/parameters/NodeID'
    get:
      operationId: getNodeStatus
      summary: Ask a node now what it is and what it can take.
      description: |
        Dials the node and asks GetNodeInfo and GetNodeStatus, within 3 seconds, the same bound a solve's admission uses. A node that does not answer is a 200 with `reachable` false, not an error of this server. A revoked node is not asked. `running_solves` is read from this server's own jobs in either case.
      tags:
        - nodes
      responses:
        '200':
          description: What the node said, or why it said nothing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/nodes/{nodeId}/jobs:
    parameters:
      - $ref: '#/components/parameters/NodeID'
    get:
      operationId: listNodeJobs
      summary: List the solves this server ran on one node, newest first.
      description: |
        The node's solve history, from this server's own jobs: every owner's, projects in Trash included, because it describes the node and not a project. Each job carries its workers, its peak memory and CPU time (when the node reported them) and its outcome.
      tags:
        - nodes
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of the node's jobs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/plans/{planId}/jobs:
    parameters:
      - $ref: '#/components/parameters/PlanID'
    get:
      operationId: listJobs
      summary: List one plan's solves, newest first.
      tags:
        - jobs
      responses:
        '200':
          description: The plan's jobs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: createJob
      summary: Dispatch a solve and answer at once.
      description: |
        Admission runs before anything is sent, so a revoked node, a node already at its concurrency ceiling, a node that does not answer, and a file that cannot be improved on because its timetable does not place every lesson are all refused here rather than discovered minutes later. What follows outlives this request: a solve takes minutes and the answer is the job, not the timetable.
        The solve reads the version or the result it names and never writes the plan: a timetable it finds is kept as a new result of the plan (listResults), a full document of the school it read with the timetable, so editing can go on while it runs. Beyond the plan's results cap the oldest unpinned results are removed for good. A solve whose node fails, stops answering or runs past the deadline after sending a timetable still keeps the best one received.
        With a rule profile the model is sent with an empty `rule_config` and the profile as the request's `rule_config`, so the profile's rules replace the plan's completely for this solve; the plan's document is not changed. The job and its result record the profile's name then.
        404 covers a version or a result the plan does not have, a result in Trash, and a school rule profile that does not exist. 422 `error.validation` with `plan_version: required` names neither file, with `result_id: exclusive` names both, and with `school_rule_profile_id: exclusive` names both a built-in and a school profile.
        Only the plan's owner starts a solve; anyone else gets 403 `plans.notYours` and may fork the plan instead.
      tags:
        - jobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreate'
      responses:
        '202':
          description: The job, accepted and running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            No node can take it. `solve.limitTooLong` carries `max_seconds` when the request exceeds every reachable node's ceiling. Otherwise message `solve.nodeUnavailable`, with detail `cause`: `none` when no node is paired and unrevoked (or the one named is revoked), `busy` when every candidate already carries as many solves as its `solves_at_once` or the node's own ceiling for this server allows, or has no memory for one worker, `unreachable` when every candidate that had room did not answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            The body names no usable file or profile, or the file cannot be improved on. Three messages. `error.validation` with field codes, such as the ones the operation lists. `solve.incompleteBaseline` for an improve of a file whose timetable does not place every lesson, with `Unplaced` (lessons it does not place) and `Lessons` (lessons of the school), both decimal. `solve.modelInvalid` for an improve of a timetable the node checked and found breaking rules that must hold, with `Count` (the conflicts found, decimal) and `conflicts` (each distinct kind once, as Arrango's `Conflict.Kind` names joined by commas, such as `KIND_TEACHER_OVERLOADED,KIND_LOCKED_COLLISION`). Nothing reaches the node's solver for any of them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/jobs:
    get:
      operationId: listAllJobs
      summary: List the solves of every project of the school, newest first.
      description: |
        One call for the Jobs place and for a client that looks for running solves at start and at sign-in. Every owner's jobs are listed; each names its project, and `started_by` says whose solve it is. Jobs of a project in Trash are not listed.
      tags:
        - jobs
      parameters:
        - name: status
          in: query
          required: false
          description: |
            Only jobs in one of these statuses. Repeat the parameter for several (`status=pending&status=running` for the active ones). Absent lists every status.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/JobStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of the school's jobs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobID'
    get:
      operationId: getJob
      summary: Read one job.
      description: |
        **This is the authority.** The event stream beside it is a nudge and is lossy by design, so a client reads this on connect, re-reads it on every nudge, and never treats a frame as the last word.
      tags:
        - jobs
      responses:
        '200':
          description: The job as it now is.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      operationId: cancelJob
      summary: Cancel a running solve.
      description: |
        Cancelling a job that already finished is not an error: the caller wanted it stopped and it is stopped. The row is closed by the work itself on its way out, so the status is authoritative a moment later, not immediately. Only the owner of the job's plan cancels it; anyone else gets 403 `plans.notYours`. `Job.can_cancel` says which.
      tags:
        - jobs
      responses:
        '202':
          description: Cancellation asked for.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/jobs/{jobId}/preview:
    parameters:
      - $ref: '#/components/parameters/JobID'
    get:
      operationId: getJobPreview
      summary: The best timetable a running solve has sent so far.
      description: |
        Answers while the job runs, `received` 0 and no timetable until the first one arrives. A timetable scoring worse than one already received (an improve sends its baseline first) is counted but does not replace it. Once the job ends the preview is gone and this answers 404: the timetable, when one was kept, is the job's `result_id`.
      tags:
        - jobs
      responses:
        '200':
          description: The best timetable the solve sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/jobs/{jobId}/events:
    parameters:
      - $ref: '#/components/parameters/JobID'
    get:
      operationId: watchJob
      summary: Watch a solve as it runs.
      description: |
        A `text/event-stream` of `update` events. It says something changed and nothing more: a slow reader is dropped a frame rather than allowed to stall the solve, so a client that must not miss a value reads the job itself. The stream always ends with a terminal frame: a job that has already finished, or finishes while the client subscribes, answers with one terminal frame read from the job and closes, so a late subscriber never hangs.
      tags:
        - jobs
      responses:
        '200':
          description: The stream.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/JobEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/school/key:
    get:
      operationId: getSchoolKey
      summary: What this school's files are encrypted to.
      description: |
        The public half only, which is not a secret. A client reads this to know whether the deployment holds a key at all before it offers to export an encrypted file. It is read without unlocking the key, so it answers at once and still answers when the escrow passphrase no longer opens it.
      tags:
        - school
      responses:
        '200':
          description: The key, or a statement that there is not one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/school/key/release:
    post:
      operationId: releaseSchoolKey
      summary: Hand the private half to this machine.
      description: |
        **This returns the secret that opens every file the school has encrypted.** A POST rather than a GET deliberately: a private key must never sit in a response a proxy or a browser might cache, and releasing it is an act rather than a read.
        Any signed-in member of the school may ask, because one key for the whole school was the decision and a planner who cannot open the school's files cannot do their work. A deployment that holds no key answers 404, and one whose escrow passphrase no longer opens the key answers 503.
        The desktop keeps the released key on the device, in a place only the signed-in user reads. Its local copies of the school's projects are .gpf files encrypted to this key (identity mode), so they open offline.
      tags:
        - school
      responses:
        '200':
          description: The key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolKeyRelease'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/server/settings:
    get:
      operationId: getServerSettings
      summary: The server settings, and when a change to each takes effect.
      tags:
        - server
      responses:
        '200':
          description: The stored settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      operationId: updateServerSettings
      summary: Change server settings.
      description: |
        Stored in the settings file beside the server's configuration file and checked against the same schema before it is written, so a refused value changes nothing. The answer's `applies` says when each takes effect: `public_addresses`, `trash_days`, `backups_keep` and `results_keep` at the next request; `maximum_upload_bytes` and `rate_limit_per_minute` when the server next starts, listed in `restart_pending` until then.
      tags:
        - server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerSettingsUpdate'
      responses:
        '200':
          description: The settings now stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/version:
    get:
      operationId: getBuildVersion
      summary: What this server binary is.
      description: |
        Needs no session and touches no dependency. Not limited by the request rate limit.
      tags:
        - health
      security: []
      responses:
        '200':
          description: The build.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildVersion'
  /v1/ready:
    get:
      operationId: getReadiness
      summary: Whether every dependency the server needs answers.
      description: |
        Needs no session. Probes the database, object storage and Kratos together within 5 seconds. Not limited by the request rate limit.
      tags:
        - health
      security: []
      responses:
        '200':
          description: Every dependency answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: |
            At least one dependency did not answer. Message `error.notReady`; `details` names each one that failed (`database`, `storage`, `kratos`) with the value `unavailable`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/storage:
    get:
      operationId: getStorage
      summary: What every project stores, and what waits to be deleted.
      tags:
        - storage
      responses:
        '200':
          description: Usage per project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageUsage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/storage/trash/empty:
    post:
      operationId: emptyTrash
      summary: Remove everything in every owner's Trash for good.
      description: |
        Projects in Trash go with their versions, results and jobs; checkpoints in Trash lose their name and their version is kept or removed by its project's backups cap, as when their time in Trash is up; results in Trash go. A result a running solve reads stays until the solve ends.
      tags:
        - storage
      responses:
        '200':
          description: What was removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashEmptied'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/storage/backups/trim:
    post:
      operationId: trimBackups
      summary: Apply every project's backups cap now.
      description: |
        Removes for good the older versions beyond each project's cap, every owner's projects and those in Trash included, as a new version would. A version a running solve reads stays until the solve ends.
      tags:
        - storage
      responses:
        '200':
          description: How many versions were removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupsTrimmed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/storage/sweep:
    post:
      operationId: sweepObjects
      summary: Delete now the stored objects nothing names any more.
      description: |
        The same clean-up the server runs every hour. It deletes only objects that have waited an hour; the rest wait for a later one.
      tags:
        - storage
      responses:
        '200':
          description: What the clean-up deleted and what still waits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectsSwept'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/logs:
    get:
      operationId: listLogs
      summary: The server's recent log lines.
      description: |
        The newest lines the server logged since it started, held in memory, so a restart clears them. Only lines at or above the server's own log level (`logging.level` in its configuration) are there.
      tags:
        - logs
      parameters:
        - name: level
          in: query
          required: false
          description: |
            The lowest level to list: `warn` lists warnings and errors. Absent lists every line held. Another value is refused with `level: invalid`.
          schema:
            $ref: '#/components/schemas/LogLevel'
        - name: lang
          in: query
          required: false
          description: |
            The language of each `message`. Absent is the language the server logs in (`application.language`). Another value is refused with `lang: invalid`.
          schema:
            type: string
            enum:
              - en
              - pl
        - name: limit
          in: query
          required: false
          description: How many lines at most. A value over the capacity is clamped.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        '200':
          description: The newest matching lines.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogLines'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/audit:
    get:
      operationId: listAudit
      summary: Who changed which project, account, node or setting, and when.
      description: |
        Written by the server as each change succeeds, from the day it started keeping them; nothing earlier is there. Covers what an account changed through this API: not autosaved versions, checkpoints, results or solves, and not what the server does by itself, such as the hourly Trash purge. A project, node or setting change that changed no value and a storage action that removed nothing are not written.
      tags:
        - audit
      parameters:
        - name: kind
          in: query
          required: false
          description: Only entries about this kind of thing. Absent lists every kind.
          schema:
            $ref: '#/components/schemas/AuditKind'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of entries, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      description: |
        The session token Ory Kratos returns from its native API login flow. The server validates it against Kratos; an unreachable Kratos is a 503 outage, never an anonymous session.
  schemas:
    Error:
      type: object
      required:
        - code
        - message
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          description: |
            Stable machine-readable code. Clients branch on this, never on the message or the status. Never localised, never reworded.
          examples:
            - not_found
            - conflict
            - validation
            - unauthorized
            - internal
        message:
          type: string
          description: |
            i18n key the client resolves. Never English prose - the server does not know the caller's language.
          examples:
            - error.notFound
            - session.nameTooShort
        details:
          type: object
          description: |
            Field-level detail, keyed by field path. Present on validation errors, absent otherwise. Values are codes, not sentences.
          additionalProperties:
            type: string
          examples:
            - name: too_short
              email: invalid_format
    Info:
      type: object
      required:
        - product
        - api_version
        - min_client_version
        - server_version
      additionalProperties: false
      properties:
        product:
          type: string
          enum:
            - goptivum
          description: |
            The only conclusive identification. A generic version endpoint looks the same on any two unrelated services, and a desktop connecting to an address a user typed has to know what it reached before it trusts anything else on that connection.
        api_version:
          type: string
          description: The versioned namespace this server serves, such as v1.
          examples:
            - v1
        min_client_version:
          type: string
          description: |
            The oldest client this server accepts. A client below it is too old, which is a different problem from the server being too old, and the two have different fixes.
          examples:
            - 0.1.0
        server_version:
          type: string
          description: This build, for support and logs.
          examples:
            - 0.1.0
        addresses:
          type: array
          items:
            type: string
          description: |
            Every other address this same server answers on, as the school configured them. A client that reached the school over its local network learns the public address here and keeps both, so a laptop carried out of the building reconnects without anyone typing it. Empty or absent means the school published none, which is what a deployment reachable at one address looks like.
          examples:
            - - https://plan.szkola.edu.pl
        maximum_upload_bytes:
          type: integer
          format: int64
          minimum: 1
          description: |
            The largest upload this server accepts, in bytes: an import, a new version or a result, as the server enforces it now (a changed server setting applies after a restart). A client checks a file against it before sending, and names it when an upload is refused with 413, which does not always carry it.
          examples:
            - 16777216
        max_solve_seconds:
          type: number
          format: double
          minimum: 0
          maximum: 86400
          description: Largest ceiling reported by an active solver node for this server; zero when none can be reached.
    SchoolKey:
      type: object
      required:
        - configured
      additionalProperties: false
      description: |
        The school's own key for encrypted project files. The public half is not a secret: it is what a file is encrypted to.
      properties:
        configured:
          type: boolean
          description: |
            False when this deployment holds no key, which is what not setting an escrow passphrase means. Files are then written unencrypted unless the person opening them supplies their own key.
        recipient:
          type: string
          description: |
            The age recipient new files are encrypted to. Absent when `configured` is false.
          examples:
            - age1ql3z7hjy54pw3hyww5ayyfg7zqgvc7w3j2elw8zmrj2kg5sfn9aqmcac8p
        created_at:
          type: string
          format: date-time
          description: |
            When the key was made, on this server's first start with an escrow passphrase. Absent when `configured` is false.
    SchoolKeyRelease:
      type: object
      required:
        - identity
        - recipient
      additionalProperties: false
      description: |
        The private half, handed to a signed-in member of this school so their machine can open the school's files without sending them to the server.
      properties:
        identity:
          type: string
          description: |
            The age identity. **This is the secret.** Anyone holding it opens every file this school has ever encrypted.
          examples:
            - AGE-SECRET-KEY-1QQPQQ...
        recipient:
          type: string
    Plan:
      type: object
      required:
        - id
        - name
        - school_year
        - created_at
        - updated_at
        - backups_keep
        - backups_keep_default
        - results_keep
        - results_keep_default
        - owner
        - can_edit
        - can_delete
      additionalProperties: false
      description: |
        One project. Every signed-in account reads every live project; only its owner changes it. Its versions, checkpoints, results and solves follow `can_edit`.
      properties:
        id:
          type: string
          description: |
            The plan id as a decimal string. It is a 64-bit integer, and JSON numbers are doubles in every browser, which silently rounds anything over 2^53.
          examples:
            - '4611686018427387904'
        name:
          type: string
          minLength: 1
          maxLength: 200
          examples:
            - Plan lekcji 2026/2027
        school_year:
          type: string
          maxLength: 32
          examples:
            - 2026/2027
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        backups_keep:
          type: integer
          minimum: 0
          maximum: 10000
          description: |
            The project's own cap on the older versions kept in Backups/, checkpoints not counted. 0 means it has none and follows `backups_keep_default`.
        backups_keep_default:
          type: integer
          minimum: 1
          description: |
            The server's `backups_keep` setting, the cap in force while `backups_keep` is 0.
        results_keep:
          type: integer
          minimum: 0
          maximum: 10000
          description: |
            The project's own cap on the unpinned results it keeps. 0 means it has none and follows `results_keep_default`.
        results_keep_default:
          type: integer
          minimum: 1
          description: |
            The server's `results_keep` setting, the cap in force while `results_keep` is 0.
        owner:
          $ref: '#/components/schemas/Owner'
        can_edit:
          type: boolean
          description: |
            Whether the caller may change the project: rename it, change its school year or caps, upload a version, name, delete or restore a checkpoint, rename, pin, delete or restore a result, and start a solve. True for the owner only; anyone else is refused with 403 `plans.notYours` and may fork it instead.
        can_delete:
          type: boolean
          description: |
            Whether the caller may move the project to Trash and restore it. True for the owner only.
        origin:
          $ref: '#/components/schemas/PlanOrigin'
    PlanCreate:
      type: object
      required:
        - name
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            Trimmed. Blank is refused with `name: required`, longer than 200 letters with `name: too_long`.
        school_year:
          type: string
          maxLength: 32
          description: |
            Trimmed. Longer than 32 letters is refused with `school_year: too_long`.
    PlanUpdate:
      type: object
      additionalProperties: false
      description: A field that is absent is left as it is.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            Trimmed. Blank is refused with `name: required`, longer than 200 letters with `name: too_long`.
          examples:
            - Plan 2027
        school_year:
          type: string
          maxLength: 32
          description: |
            Trimmed. An empty string clears it. Longer than 32 letters is refused with `school_year: too_long`.
          examples:
            - 2026/2027
        backups_keep:
          type: integer
          minimum: 0
          maximum: 10000
          description: |
            The project's own cap on the older versions kept in Backups/, checkpoints not counted. 0 drops it, so the server's default applies again. Outside 0 to 10000 is refused with `backups_keep: invalid`. A lower cap takes effect at the next new version.
          examples:
            - 5
        results_keep:
          type: integer
          minimum: 0
          maximum: 10000
          description: |
            The project's own cap on the unpinned results it keeps. 0 drops it, so the server's default applies again. Outside 0 to 10000 is refused with `results_keep: invalid`. A lower cap takes effect at the next result.
          examples:
            - 2
    PlanOrigin:
      type: object
      required:
        - plan_id
        - version
      additionalProperties: false
      description: |
        The project and version a fork or a duplicate was made from. Absent on a project that was not forked. It stays when the origin is deleted or removed for good.
      properties:
        plan_id:
          type: string
          description: The origin's id, as a decimal string like Plan.id.
        version:
          type: integer
          format: int64
          description: The origin's version the copy was made from.
        name:
          type: string
          description: |
            The origin's name now. Absent while the origin is in Trash or after it was removed for good.
    PlanFork:
      type: object
      additionalProperties: false
      description: |
        An own copy of any live project: a fork of another account's, or a duplicate of one's own.
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
          description: |
            The origin's version to copy. Absent copies the newest. A version the origin does not have is not found; below 1 is refused with `version: invalid`.
          examples:
            - 3
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            The copy's name. Trimmed. Blank is refused with `name: required`, longer than 200 letters with `name: too_long`. Absent names it after the origin with the server's `plans.forkName` in the server's own language ("Plan 2027 (fork)"), the origin's name shortened to fit.
          examples:
            - Plan 2027 (fork)
    PlanTransfer:
      type: object
      required:
        - owner_id
      additionalProperties: false
      properties:
        owner_id:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            The Kratos identity id of the account that becomes the owner. Blank is refused with `owner_id: required`, an id no account has with `owner_id: unknown`, a disabled account with `owner_id: disabled`.
    TrashItem:
      type: object
      required:
        - kind
        - plan_id
        - name
        - school_year
        - deleted_at
        - removes_at
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
            - project
            - checkpoint
            - result
          description: |
            What was deleted. A `project` is a whole plan with its versions, results and jobs, restored with restorePlan. A `checkpoint` is the name of one version of a live plan, restored with restoreCheckpoint. A `result` is one result of a live plan, restored with restoreResult.
        plan_id:
          type: string
          description: The plan, as a decimal string like Plan.id.
        name:
          type: string
          description: |
            The plan's name: for a project, the name it had when it was deleted.
        school_year:
          type: string
          description: The plan's school year.
        version:
          type: integer
          format: int64
          minimum: 1
          description: The named version. Present on a checkpoint only.
        checkpoint:
          type: string
          description: The checkpoint's name. Present on a checkpoint only.
        result:
          $ref: '#/components/schemas/SolveResult'
        deleted_at:
          type: string
          format: date-time
        removes_at:
          type: string
          format: date-time
          description: |
            When it is removed for good: `deleted_at` plus the server's `trash_days` setting. The server purges once an hour, so it can go up to an hour after this.
    TrashList:
      type: object
      required:
        - items
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TrashItem'
    ChangeList:
      type: object
      required:
        - cursor
        - reset
        - more
        - plans
      additionalProperties: false
      properties:
        cursor:
          type: string
          description: The point to ask from next, as `since`. Opaque.
        reset:
          type: boolean
          description: |
            True when there was no point, or the point is not one this server's database handed out: `plans` is empty, read everything again, then poll from `cursor`.
        more:
          type: boolean
          description: True when further changes wait; ask again at once from `cursor`.
        plans:
          type: array
          description: Each plan that changed after the point, once, in the order of its first change.
          items:
            $ref: '#/components/schemas/PlanChange'
    PlanChange:
      type: object
      required:
        - plan_id
        - state
        - parts
      additionalProperties: false
      properties:
        plan_id:
          type: string
          description: The plan, as a decimal string like Plan.id.
        state:
          $ref: '#/components/schemas/PlanState'
        parts:
          type: array
          minItems: 1
          uniqueItems: true
          description: What of the plan changed, in the order project, versions, results.
          items:
            $ref: '#/components/schemas/ChangedPart'
    PlanState:
      type: string
      enum:
        - live
        - trash
        - removed
      description: |
        Where a changed plan is now. `live` is readable by every account. `trash` is in its owner's Trash: only the owner lists it, with listTrash, and restores it. `removed` is deleted for good.
    ChangedPart:
      type: string
      enum:
        - project
        - versions
        - results
      description: |
        What of a plan changed. `project` is the plan itself: created, renamed, its school year or a cap changed, moved to Trash or restored, given to another owner, removed for good, or a new version moved its `updated_at`. `versions` is its timeline: a new main version, older versions the backups cap removed, a checkpoint named, deleted, restored or ended in Trash. `results` is its results: one kept, named, pinned, moved to Trash or restored, or removed by the results cap or the purge.
    PlanPage:
      type: object
      required:
        - items
        - page
        - limit
        - total
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Plan'
        page:
          type: integer
          description: The page this response is, echoed back after clamping.
        limit:
          type: integer
          description: The page size applied, which may be lower than the one asked for.
        total:
          type: integer
          description: How many live plans match, for the page count.
    Version:
      type: object
      required:
        - plan_id
        - version
        - object_key
        - size_bytes
        - created_at
        - created_by
      additionalProperties: false
      properties:
        plan_id:
          type: string
          description: Decimal string, as on Plan.
        version:
          type: integer
          format: int64
          minimum: 1
        parent:
          type: integer
          format: int64
          description: |
            The version this one was derived from. Absent on version 1, which is created with the plan.
        object_key:
          type: string
          description: |
            Where the document sits in object storage, content-addressed. Clients download through this API and never reach into the store, which is what keeps validation, id allocation and version checks in one place.
        size_bytes:
          type: integer
          format: int64
          description: The compressed size of the stored document.
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          description: The identity that uploaded it.
        valid_from:
          type: string
          format: date
          description: |
            The first day this schedule applies. A school's timetable changes mid-year, so one plan holds a September schedule and a February one.
        valid_to:
          type: string
          format: date
          description: The last day this schedule applies. Absent means open-ended.
        summary:
          $ref: '#/components/schemas/VersionSummary'
        checkpoint:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            The checkpoint name when this version is a named checkpoint. Absent otherwise, and while the checkpoint is in Trash.
    VersionList:
      type: object
      required:
        - items
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Version'
    VersionUpload:
      type: object
      required:
        - document
        - parent
        - upload_key
      additionalProperties: false
      properties:
        document:
          type: string
          format: binary
          description: The encoded document.
        parent:
          type: integer
          format: int64
          minimum: 1
          description: |
            The version this was derived from. Absent or below 1 is refused with `parent: required` or `parent: invalid`.
        upload_key:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,64}$
          description: |
            Random, chosen by the client for this one upload and sent again unchanged on a retry. Stored on the version, unique per plan. Absent is refused with `upload_key: required`, a value outside the pattern with `upload_key: invalid`, and a key already stored with another document or parent with `upload_key: reused`.
        summary:
          $ref: '#/components/schemas/VersionSummary'
        valid_from:
          type: string
          format: date
          description: |
            Absent keeps the parent's date, an empty value clears it. A value that is not a date is refused with `valid_from: invalid`.
        valid_to:
          type: string
          format: date
          description: |
            Absent keeps the parent's date, an empty value clears it. A value that is not a date is refused with `valid_to: invalid`.
    VersionSummary:
      type: object
      description: |
        What changed from the parent, as counts per edit kind and then per kind of thing, such as `{"added":{"teacher":3},"moved":{"lesson":2}}`. Never prose: every reader words it in its own language. Names are lower camel case (letters and digits, starting with a letter, at most 32), counts are 1 to 1000000, and the whole object is at most 4096 bytes of JSON. Absent on a version whose uploader sent none.
      additionalProperties:
        type: object
        additionalProperties:
          type: integer
          minimum: 1
          maximum: 1000000
    CheckpointName:
      type: object
      required:
        - name
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            Trimmed. Blank is refused with `name: required`, longer than 200 letters with `name: too_long`.
          examples:
            - tydzień i klasy
    Conflict:
      type: object
      required:
        - code
        - message
        - current_version
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            - conflict
        message:
          type: string
          description: i18n key the client resolves.
        current_version:
          type: integer
          format: int64
          description: |
            The version the plan is actually at. The client shows "someone saved first, here is their version" instead of overwriting their work.
    Finding:
      type: object
      required:
        - kind
        - severity
        - count
      additionalProperties: false
      properties:
        kind:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          description: Stable, localisable identity of the finding.
          examples:
            - unmapped_element
            - unknown_reference
            - lesson_dropped
        severity:
          type: string
          enum:
            - info
            - warning
            - error
          description: |
            error means data was lost: a lesson the file describes did not survive the import.
        entities:
          type: array
          description: The entities involved, for a client that highlights them.
          items:
            $ref: '#/components/schemas/EntityRef'
        count:
          type: integer
          minimum: 1
          description: |
            How many occurrences this one finding stands for. Findings that are the same kind, severity and entities are merged into one and their counts added, and a reader that tallied a bulk loss (80 lessons with no placement) counts each item, so the same fact is listed once. 1 for a single occurrence.
    EntityRef:
      type: object
      required:
        - kind
        - id
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
            - division
            - group
            - teacher
            - room
            - subject
            - year
            - external_block
            - split
            - link
          description: |
            division is a class. split (a class's division into groups) and link (a lesson link) appear only in check findings.
        id:
          type: integer
          description: The entity id inside the document.
    ImportResult:
      type: object
      required:
        - plan_id
        - version
        - importer
        - findings
      additionalProperties: false
      properties:
        plan_id:
          type: string
          description: Decimal string, as on Plan.
        version:
          type: integer
          format: int64
        importer:
          type: string
          description: Which importer claimed the file.
          examples:
            - optivum.pla
            - optivum.html
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
    ImportPreview:
      type: object
      required:
        - importer
        - name
        - counts
        - findings
      additionalProperties: false
      properties:
        importer:
          type: string
          description: Which importer claimed the file, as on ImportResult.
          examples:
            - optivum.pla
            - optivum.html
            - goptivum.gpf
        school:
          type: string
          description: |
            The school's name as the file carries it. Absent when the file names no school, as a single o*.html page or an Optivum export whose school left the name blank.
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            The name importPlan gives the plan when the request names none: the school's name, else the uploaded file name without its extension.
        counts:
          $ref: '#/components/schemas/ImportCounts'
        findings:
          type: array
          description: What did not map, merged as on ImportResult.
          items:
            $ref: '#/components/schemas/Finding'
    ImportCounts:
      type: object
      required:
        - days
        - periods
        - classes
        - groups
        - teachers
        - subjects
        - rooms
        - lessons
        - placed
      additionalProperties: false
      description: How much of the school the file holds, counted in the school data the import would store.
      properties:
        days:
          type: integer
          minimum: 0
        periods:
          type: integer
          minimum: 0
        classes:
          type: integer
          minimum: 0
        groups:
          type: integer
          minimum: 0
        teachers:
          type: integer
          minimum: 0
        subjects:
          type: integer
          minimum: 0
        rooms:
          type: integer
          minimum: 0
        lessons:
          type: integer
          minimum: 0
          description: Lessons of the school data; one may span several periods.
        placed:
          type: integer
          minimum: 0
          description: |
            Lessons the file's timetable places. Equal to lessons for a finished Optivum timetable, 0 for a file that carries none.
    Check:
      type: object
      required:
        - plan_id
        - version
        - errors
        - warnings
        - notes
        - ignored
        - findings
      additionalProperties: false
      properties:
        plan_id:
          type: string
          description: Decimal string, as on Plan.
        version:
          type: integer
          format: int64
          description: |
            The version checked, or for a result the version its solve read.
        result_id:
          type: string
          description: The result checked, as a decimal string. Absent for a version.
        errors:
          type: integer
          description: Findings of severity error the document does not ignore.
        warnings:
          type: integer
          description: Findings of severity warning the document does not ignore.
        notes:
          type: integer
          description: Findings of severity note the document does not ignore.
        ignored:
          type: integer
          description: Findings the document ignores, of any severity.
        findings:
          type: array
          description: |
            Every finding, ignored ones included and marked. Input findings come first, then the timetable's.
          items:
            $ref: '#/components/schemas/CheckFinding'
        score:
          $ref: '#/components/schemas/CheckScore'
    CheckFinding:
      type: object
      required:
        - kind
        - part
        - severity
        - ignored
      additionalProperties: false
      properties:
        kind:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          description: |
            What is wrong. A hard conflict's kind without its prefix (`teacher_overloaded` for KIND_TEACHER_OVERLOADED) or a soft issue's category (`student_gap`). `invalid_model` is a school the node could not take at all, most often one with no week yet; it names nothing and nothing else is checked. `unknown` is a kind this server does not know.
          examples:
            - teacher_overloaded
            - room_pool_overloaded
            - invalid_model
            - student_gap
        part:
          type: string
          enum:
            - input
            - timetable
            - rule
          description: School input, timetable validity, or a configured rule finding.
        severity:
          type: string
          enum:
            - error
            - warning
            - note
          description: |
            error: a solve refuses this school, or the timetable breaks a hard rule. warning: a solve still runs, or the timetable misses a comfort rule. note: hygiene the rating ignores.
        ignored:
          type: boolean
          description: |
            The document ignores this finding: one of its ignored findings has this kind, these entities, these lessons and these exact time spans, in any order.
        entities:
          type: array
          description: |
            What the finding names. A `split` or `link` is not a place to go to; it tells which split or lesson link the finding is about.
          items:
            $ref: '#/components/schemas/EntityRef'
        lessons:
          type: array
          description: The lessons the finding names, with where each one sits.
          items:
            $ref: '#/components/schemas/CheckLesson'
        spans:
          type: array
          description: The periods the finding covers.
          items:
            $ref: '#/components/schemas/CheckSpan'
        needed:
          type: integer
          minimum: 0
          description: |
            Periods a week the lessons need. Only `teacher_overloaded` and `room_pool_overloaded` carry it, always together with `available`.
        available:
          type: integer
          minimum: 0
          description: Periods a week that are free for them. Zero is a real value.
        count:
          type: integer
          minimum: 0
          description: |
            A soft issue's size, such as the periods in a gap. Absent on hard findings.
    CheckLesson:
      type: object
      required:
        - lesson_id
      additionalProperties: false
      properties:
        lesson_id:
          type: integer
          minimum: 1
        day_id:
          type: integer
          description: The day it is placed on. Absent when the lesson is not placed.
        start_period:
          type: integer
          description: |
            The period it starts in, counted the way the document's placements count them. Absent when it is not placed.
        duration:
          type: integer
          description: Periods the lesson takes. Absent when the node did not say.
        room_id:
          type: integer
          description: The room it is placed in. Absent when it has none.
    CheckSpan:
      type: object
      required:
        - day_id
        - start_period
        - period_span
      additionalProperties: false
      properties:
        day_id:
          type: integer
        start_period:
          type: integer
          description: Counted the way the document's placements count periods.
        period_span:
          type: integer
          minimum: 1
          description: Consecutive periods from start_period.
    CheckScore:
      type: object
      required:
        - rating
        - quality
        - students_quality
        - teachers_quality
        - metrics
        - classes
        - teachers
      additionalProperties: false
      description: |
        The timetable's comfort and error-capped rating. Present only when the version's timetable places every lesson of a school that has lessons.
      properties:
        rating:
          type: number
          format: double
          description: Comfort capped by unignored errors at max(0, 50 - 5 * errors); comfort when no errors.
        quality:
          type: number
          format: double
          description: Comfort from enabled rules, from 0 to 100. Errors cap rating separately.
        students_quality:
          type: number
          format: double
        teachers_quality:
          type: number
          format: double
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/CheckMetric'
        classes:
          type: array
          description: One rating per class.
          items:
            $ref: '#/components/schemas/CheckEntityScore'
        teachers:
          type: array
          description: One rating per teacher.
          items:
            $ref: '#/components/schemas/CheckEntityScore'
    CheckMetric:
      type: object
      required:
        - key
        - group
        - applicable
        - rate
        - subscore
        - count
      additionalProperties: false
      properties:
        key:
          type: string
          description: The node's stable metric name.
          examples:
            - gaps
            - t_late
        group:
          type: string
          enum:
            - students
            - teachers
        applicable:
          type: boolean
          description: False when no rule or nothing to measure applies; then it is not rated.
        rate:
          type: number
          format: double
          description: The count over the metric's own denominator.
        subscore:
          type: number
          format: double
          description: 0 to 100.
        count:
          type: integer
          format: int64
    CheckEntityScore:
      type: object
      required:
        - id
        - rating
        - quality
        - items
      additionalProperties: false
      properties:
        rating:
          type: number
          format: double
          description: Comfort capped by unignored errors at max(0, 50 - 5 * errors); comfort when no errors.
        id:
          type: integer
          description: The class's or teacher's id in the document.
        quality:
          type: number
          format: double
          description: 0 to 100.
        items:
          type: array
          description: What lowered it, by soft issue category.
          items:
            $ref: '#/components/schemas/CheckScoreItem'
    CheckScoreItem:
      type: object
      required:
        - category
        - count
      additionalProperties: false
      properties:
        category:
          type: string
          examples:
            - student_gap
            - late_student
        count:
          type: integer
          minimum: 0
    RuleCatalogue:
      type: object
      required:
        - rules
        - profiles
      additionalProperties: false
      properties:
        rules:
          type: array
          description: Every rule a plan's `rule_config` may name, in the solver's table order.
          items:
            $ref: '#/components/schemas/RuleDefinition'
        profiles:
          type: array
          description: |
            The built-in profiles, `default` first. A plan's `rule_config.profile` names one; an empty name means `default`.
          items:
            $ref: '#/components/schemas/RuleProfile'
    RuleDefinition:
      type: object
      required:
        - key
        - default_mode
        - hardable
        - by_year
        - by_division
        - by_subject
        - by_teacher
        - default_weight
        - default_param
        - param_kind
      additionalProperties: false
      properties:
        key:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          description: The name a rule override uses (`RuleOverride.rule` in the document).
          examples:
            - teacher_gaps
            - subject_once
            - stability
        default_mode:
          $ref: '#/components/schemas/RuleMode'
        default_weight:
          type: integer
          format: int64
          minimum: 1
          description: The solver's soft cost when no profile or plan override supplies a weight.
        default_param:
          type: integer
          minimum: 0
          description: The built-in rule parameter. Zero means none or a required explicit value.
        param_kind:
          type: string
          enum:
            - none
            - spread
            - edge_periods
            - days
            - latest_first_period
          description: What the rule's parameter counts; none means the rule has no parameter.
        hardable:
          type: boolean
          description: The rule may be set to hard. The node refuses hard on a rule that may not.
        by_year:
          type: boolean
          description: An override may name a year.
        by_division:
          type: boolean
          description: An override may name a class (a division, as in EntityRef).
        by_subject:
          type: boolean
          description: An override may name a subject.
        by_teacher:
          type: boolean
          description: |
            An override may name a teacher. A rule with no scope at all is set for the whole school only.
    RuleProfile:
      type: object
      required:
        - name
        - overrides
      additionalProperties: false
      properties:
        name:
          type: string
          examples:
            - default
            - dobry_plan
            - relaxed
        overrides:
          type: array
          description: |
            Applied in order over the rules' defaults, before the plan's own overrides. They name no year, class, subject or teacher.
          items:
            $ref: '#/components/schemas/RuleOverride'
    RuleOverride:
      type: object
      required:
        - rule
      additionalProperties: false
      properties:
        rule:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          maxLength: 64
          description: A RuleDefinition key.
        mode:
          $ref: '#/components/schemas/RuleMode'
        weight:
          type: integer
          format: int64
          minimum: 1
          description: The soft weight. Absent keeps the solver's built-in weight.
        param:
          type: integer
          minimum: 1
          description: |
            The rule's own number, such as `anti_split_shift`'s edge periods. Absent keeps the built-in value.
    RuleMode:
      type: string
      enum:
        - hard
        - soft
        - 'off'
      description: |
        hard: a solve never breaks it, and breaking it is an error. soft: breaking it costs its weight. off: the rule does not exist for this school. On a RuleOverride an absent mode keeps the mode the rule already has.
    SchoolRuleProfile:
      type: object
      required:
        - id
        - name
        - overrides
        - created_by
        - created_at
        - updated_at
        - editable
      additionalProperties: false
      description: |
        A rule profile of the school's own, shared by every account. A solve that picks it uses its overrides in place of every rule of the plan.
      properties:
        id:
          type: string
          description: Decimal string, because a 64-bit id does not survive a JSON number.
        name:
          type: string
          minLength: 1
          maxLength: 200
        overrides:
          type: array
          description: |
            Applied in order over the rules' defaults. They name no year, class, subject or teacher: a profile serves every plan of the school, and those ids belong to one plan.
          items:
            $ref: '#/components/schemas/RuleOverride'
        created_by:
          $ref: '#/components/schemas/Starter'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        editable:
          type: boolean
          description: |
            The caller may change and delete it: the caller created it, or is an administrator.
    SchoolRuleProfileList:
      type: object
      required:
        - items
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SchoolRuleProfile'
    SchoolRuleProfileCreate:
      type: object
      required:
        - name
        - overrides
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 200
          description: Trimmed; required and unique among the school's profiles.
        overrides:
          type: array
          maxItems: 64
          description: At most one override per rule. Empty is the solver's defaults.
          items:
            $ref: '#/components/schemas/RuleOverride'
    SchoolRuleProfileUpdate:
      type: object
      additionalProperties: false
      description: A field that is absent is left as it is.
      properties:
        name:
          type: string
          maxLength: 200
          description: Trimmed; required and unique among the school's profiles.
        overrides:
          type: array
          maxItems: 64
          description: Replaces every override of the profile.
          items:
            $ref: '#/components/schemas/RuleOverride'
    SolveRuleProfile:
      type: object
      required:
        - name
      additionalProperties: false
      description: |
        The rule profile a solve used in place of the plan's own rules, as it was when the solve started. A job or a result without one used the plan's own rules.
      properties:
        name:
          type: string
          description: |
            A built-in profile's name (`default`, `dobry_plan`, ...) when `id` is absent; otherwise the school profile's name when the solve started.
        id:
          type: string
          description: |
            The school profile's id, absent for a built-in. The profile may have been renamed or deleted since.
    AccountLibrary:
      type: object
      required:
        - version
        - folders
        - projects
        - pinned
        - recent
      additionalProperties: false
      description: |
        How one account arranges its Library. Only that account reads it. A project is named by its id, as a decimal string like Plan.id; a project the arrangement does not place sits at the top level after the ones `projects` orders.
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
          description: |
            Counts the saves of this arrangement, 0 before the first. A save sends the version it read; the answer carries the one it stored.
        folders:
          type: array
          maxItems: 500
          description: Every folder; siblings in the order shown.
          items:
            $ref: '#/components/schemas/LibraryFolder'
        projects:
          type: array
          maxItems: 5000
          description: The top level's projects, in the order shown.
          items:
            type: string
            pattern: ^[0-9]{1,19}$
        pinned:
          type: array
          maxItems: 5000
          description: The projects kept at the front of wherever they sit.
          items:
            type: string
            pattern: ^[0-9]{1,19}$
        recent:
          type: array
          maxItems: 20
          description: The projects the account opened last, newest first.
          items:
            type: string
            pattern: ^[0-9]{1,19}$
    LibraryFolder:
      type: object
      required:
        - id
        - name
        - accent
        - pinned
        - projects
      additionalProperties: false
      description: |
        A folder of projects, this account's own. It holds project ids, never the projects: deleting it deletes none of them.
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
          description: Chosen by the client; unique in the arrangement.
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Trimmed; required.
        parent_id:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
          description: |
            The folder this one sits in; absent at the top level. At most 8 folders deep.
        accent:
          type: string
          pattern: ^[a-z0-9-]{0,32}$
          description: The folder's tint, an accent name the desktop declares; empty is the default.
        pinned:
          type: boolean
          description: Kept at the front of the folder it sits in.
        projects:
          type: array
          maxItems: 5000
          description: |
            The projects in this folder, in the order shown. A project sits in one place at most: one folder, or the top level's list.
          items:
            type: string
            pattern: ^[0-9]{1,19}$
    AccountLibraryConflict:
      type: object
      required:
        - code
        - message
        - current
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            - conflict
        message:
          type: string
          description: i18n key the client resolves.
        current:
          $ref: '#/components/schemas/AccountLibrary'
    User:
      type: object
      required:
        - id
        - username
        - email
        - role
        - active
        - must_change_password
      additionalProperties: false
      properties:
        id:
          type: string
          description: Kratos's identity id, a UUID.
          examples:
            - 03b1a366-d0b7-48d8-9e0d-c6520389c33c
        username:
          type: string
          description: A password identifier, so it signs in as well as the email.
          examples:
            - kowalski
        email:
          type: string
          format: email
          description: Also a password identifier. Nothing is ever sent to it.
        name:
          type: string
          description: Display name. Absent on an account that never set one.
        role:
          $ref: '#/components/schemas/Role'
        active:
          type: boolean
          description: |
            False is disabled: the credential is left in place, so re-enabling needs no new password.
        must_change_password:
          type: boolean
          description: Raised at creation and cleared once the password is changed.
    Role:
      type: string
      enum:
        - admin
        - planner
      description: |
        Stored in metadata_public, never in traits. A role in traits would be a self-service promotion to administrator, because the settings flow writes traits and the account owns them.
    UserCreate:
      type: object
      required:
        - username
        - email
        - role
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        email:
          type: string
          format: email
          maxLength: 320
        name:
          type: string
          maxLength: 128
        role:
          $ref: '#/components/schemas/Role'
    UserUpdate:
      type: object
      description: |
        Only what an administrator may change about somebody else. A password is not here: it has its own endpoint because it answers with a secret.
      additionalProperties: false
      properties:
        role:
          $ref: '#/components/schemas/Role'
        active:
          type: boolean
    UserCreated:
      type: object
      required:
        - user
        - password
      additionalProperties: false
      description: |
        The only response that carries a password, and the only time this one exists anywhere. It is generated rather than chosen, because an administrator typing passwords for a school picks the same one twice.
      properties:
        user:
          $ref: '#/components/schemas/User'
        password:
          type: string
          description: |
            Shown once and never retrievable. The account is flagged to require a change at the first sign-in.
    PasswordReset:
      type: object
      required:
        - password
      additionalProperties: false
      properties:
        password:
          type: string
          description: A freshly generated password, shown once.
    UserPage:
      type: object
      required:
        - items
        - page
        - limit
        - total
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
          description: |
            Every account, not the page. Kratos has no filter for a trait, so the listing is read whole and paged here.
    UserSession:
      type: object
      required:
        - id
        - current
        - authenticated_at
        - expires_at
      additionalProperties: false
      description: |
        One session an account signs in with, as Kratos's admin API reports it.
      properties:
        id:
          type: string
          description: Kratos's session id, a UUID.
        current:
          type: boolean
          description: True for the session the request listing it was made with.
        authenticated_at:
          type: string
          format: date-time
          description: When the account signed in with this session.
        expires_at:
          type: string
          format: date-time
          description: When the session stops signing the account in by itself.
        ip_address:
          type: string
          description: |
            The client address Kratos recorded for the session, the newest when it recorded several; usually where the account signed in from. Absent when it recorded none.
        user_agent:
          type: string
          description: |
            The client program Kratos recorded with that address. Absent when it recorded none.
    UserSessionList:
      type: object
      required:
        - items
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserSession'
    SettingApplies:
      type: string
      enum:
        - now
        - restart
      description: |
        When a change to a setting takes effect: `now`, on the next request, or `restart`, once the server is restarted.
    Lockout:
      type: object
      required:
        - account_failures
        - address_failures
        - block_minutes
        - applies
      additionalProperties: false
      description: The sign-in lockout the server's /kratos proxy enforces.
      properties:
        account_failures:
          type: integer
          minimum: 1
          maximum: 100
          description: Failed sign-ins with one sign-in name before that name is blocked.
        address_failures:
          type: integer
          minimum: 1
          maximum: 1000
          description: |
            Failed sign-ins from one client address, with any names, before that address is blocked.
        block_minutes:
          type: integer
          minimum: 1
          maximum: 1440
          description: |
            How long a block lasts. Failures older than this are forgotten, so the limits count failures within this many minutes.
        applies:
          $ref: '#/components/schemas/SettingApplies'
    LockoutUpdate:
      type: object
      additionalProperties: false
      description: |
        The limits to change. An absent field keeps its value; an empty body is refused as `body: empty`. A value outside its range is refused with that field and `invalid`.
      properties:
        account_failures:
          type: integer
          minimum: 1
          maximum: 100
        address_failures:
          type: integer
          minimum: 1
          maximum: 1000
        block_minutes:
          type: integer
          minimum: 1
          maximum: 1440
    PasswordRules:
      type: object
      required:
        - known
      additionalProperties: false
      description: |
        Kratos's password rules. Every other field is present only when `known` is true.
      properties:
        known:
          type: boolean
          description: False when the server has no readable Kratos configuration file.
        min_length:
          type: integer
          description: The shortest password Kratos accepts.
        identifier_similarity:
          type: boolean
          description: Whether Kratos refuses a password too similar to the username or email.
        breach_check:
          type: boolean
          description: |
            Whether Kratos asks the Have I Been Pwned service about each new password. On, it needs internet access.
        max_breaches:
          type: integer
          description: |
            How many known breaches a password may appear in before Kratos refuses it, when `breach_check` is on.
    Node:
      type: object
      required:
        - id
        - label
        - address
        - fingerprint
        - paired_at
        - active
        - solves_at_once
        - workers_per_solve
      additionalProperties: false
      properties:
        id:
          type: string
          description: Decimal string, because a 64-bit id does not survive a JSON number.
          examples:
            - '4611686018427387904'
        label:
          type: string
          description: What this deployment calls the node. Local, not the node's own name.
          examples:
            - school-node
        address:
          type: string
          description: |
            Where it was last reached. Changing it needs no re-pairing, because the pin is the certificate.
          examples:
            - 127.0.0.1:9443
        fingerprint:
          type: string
          description: |
            SHA-256 of the node's certificate, base32 in groups of four. This is the identity: a node presenting anything else is refused as an impostor, including the same node after its certificate was regenerated.
          examples:
            - 7YRR-VPVG-QOH5-626M-23QG-Q554-ZICU-ANHS-2YQQ-UDZ5-QN3Y-G7PJ-S7NQ
        paired_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          description: Absent while the node is still trusted.
        active:
          type: boolean
          description: False once revoked. A revoked node is refused before anything is dialled.
        solves_at_once:
          type: integer
          minimum: 1
          maximum: 64
          description: |
            This server's own limit: how many of its solves may run on the node at once. A further solve is refused as busy. It never exceeds the node's own ceiling for this server: admission also checks that ceiling live.
        workers_per_solve:
          type: integer
          minimum: 1
          maximum: 64
          description: |
            This server's own limit: the workers each solve on the node gets, fewer when the solve asks for fewer or the node's free memory covers fewer.
    NodePair:
      type: object
      required:
        - uri
      additionalProperties: false
      properties:
        uri:
          type: string
          description: |
            The arrango:// URI the node printed. It carries the fingerprint to pin and a one-time token, both in the fragment, which never reaches a server. This server verifies the presented certificate against the fingerprint before the token travels.
          examples:
            - arrango://10.0.0.5:9443#fp=7YRR-VPVG-QOH5-626M&t=ABCD-EFGH-IJKL-MNOP
        label:
          type: string
          maxLength: 64
          description: What to call it locally. Absent means the node's own label.
    NodePaired:
      type: object
      required:
        - node
        - node_api_version
        - solver_version
        - min_client_version
      additionalProperties: false
      properties:
        node:
          $ref: '#/components/schemas/Node'
        node_api_version:
          type: string
          description: The node's API version, read during the pairing call itself.
        solver_version:
          type: string
        min_client_version:
          type: string
          description: |
            The oldest caller this node accepts. It is checked on every call, not only at pairing, so a node upgrade can turn away a peer already on its list.
    NodeList:
      type: object
      required:
        - items
      additionalProperties: false
      properties:
        items:
          type: array
          description: Revoked nodes included, so an operator can see what was removed.
          items:
            $ref: '#/components/schemas/Node'
    NodeUpdate:
      type: object
      additionalProperties: false
      description: At least one field. An absent field is left as it is.
      properties:
        label:
          type: string
          maxLength: 64
          description: The new local name, trimmed. Jobs and the node's history read it from here.
        solves_at_once:
          type: integer
          minimum: 1
          maximum: 64
        workers_per_solve:
          type: integer
          minimum: 1
          maximum: 64
    NodeStatus:
      type: object
      required:
        - node_id
        - reachable
        - running_solves
      additionalProperties: false
      description: |
        The node as it answered just now. Every field but node_id, reachable, problem and running_solves is absent when it did not answer.
      properties:
        node_id:
          type: string
        reachable:
          type: boolean
          description: |
            True when the node answered both GetNodeInfo and GetNodeStatus within 3 seconds. False for a revoked node, which is not asked.
        problem:
          type: string
          enum:
            - node.unreachable
            - node.fingerprintMismatch
            - node.notPaired
            - node.clientTooOld
          description: |
            Why an unrevoked node is not reachable, as a message key: `node.unreachable` (it could not be reached or did not answer), `node.fingerprintMismatch` (its address presented another certificate: another machine, or the node's identity was replaced; pair it again), `node.notPaired` (it no longer accepts this server, usually because its operator revoked it there; pair it again), `node.clientTooOld` (it needs a newer version of this server). Absent when reachable or revoked.
        running_solves:
          type: integer
          description: |
            This server's solves on the node that are pending or running, from its own jobs. Not the node's own count, which also holds checks and other deployments' solves.
        node_api_version:
          type: string
        solver_version:
          type: string
        min_client_version:
          type: string
          description: The oldest version of this server the node accepts.
        cores:
          type: integer
        free_memory_bytes:
          type: integer
          format: int64
          description: |
            The memory a new solve can plan against: what the node has available less what its running solves reserved.
        ceilings:
          $ref: '#/components/schemas/NodeCeilings'
    NodeCeilings:
      type: object
      required:
        - workers_per_solve
        - max_solve_seconds
      additionalProperties: false
      description: |
        The node's own limits for this server, set by its operator when it was paired (`arrango-node pair --max-solves --worker-ceiling`). Absent from a status when the node's build does not report them.
      properties:
        max_solve_seconds:
          type: number
          format: double
          minimum: 0
          maximum: 86400
          description: Longest solve allowed for this server by this node's pairing policy.
        solves_at_once:
          type: integer
          description: Absent when the node sets no limit of its own on this server's solves at once.
        workers_per_solve:
          type: integer
          description: |
            The node's worker ceiling for this server, or its core count when it sets none.
    Job:
      type: object
      required:
        - id
        - plan_id
        - plan_name
        - plan_version
        - node_id
        - node_label
        - status
        - num_workers
        - time_limit_seconds
        - improve
        - stall_stop_seconds
        - started_by
        - created_at
        - can_cancel
      additionalProperties: false
      properties:
        id:
          type: string
          description: Decimal string, because a 64-bit id does not survive a JSON number.
        plan_id:
          type: string
        plan_name:
          type: string
          description: The project's name now, so a list across projects names each.
        plan_version:
          type: integer
          format: int64
          description: |
            Which version's school the solve read: the version it named, or the source version of the result it named. The new result's source version. The backups cap never removes it while the job is pending or running.
        source_result_id:
          type: string
          description: |
            The result the solve read instead of a version, as a decimal string; absent when it read a version. Draw a preview over this result's document: its school is `plan_version`'s, and that version may already be gone. The results cap and the Trash purge never remove it while the job is pending or running.
        node_id:
          type: string
        node_label:
          type: string
          description: The node's label now, so a renamed node reads under its new name.
        status:
          $ref: '#/components/schemas/JobStatus'
        reason:
          type: string
          enum:
            - solve.infeasible
            - solve.noScheduleInTime
            - solve.nodeError
            - solve.resultNotStored
            - solve.serverRestarted
            - solve.preflightFailed
          description: |
            Why a solve failed or kept nothing, as a message key the client words; absent when there is nothing to explain. `solve.infeasible`: the node proved the school cannot be scheduled, at its input checks or in the search (`explanation` and `detail` say more in the node's words). `solve.noScheduleInTime`: the time limit ran out before a timetable was found. `solve.nodeError`: the node failed, stopped answering, broke the stream or ran past the solve's deadline; `result_id` is then the best timetable received before that, when one arrived. `solve.resultNotStored`: a timetable arrived and this server could not store it. `solve.serverRestarted`: this server stopped while the solve was open.
        result_id:
          type: string
          description: |
            The result this solve kept in the project's results, as a decimal string. Absent when nothing was kept. A `failed` job has one when the node failed after sending a timetable (reason `solve.nodeError`). It can outlive the result: one removed by the results cap or from Trash answers 404.
        started_by:
          $ref: '#/components/schemas/Starter'
        can_cancel:
          type: boolean
          description: |
            Whether the caller may cancel the solve: true when it owns the job's project and the project is not in Trash, whatever the status. `status` says whether anything is left to stop.
        rule_profile:
          $ref: '#/components/schemas/SolveRuleProfile'
        num_workers:
          type: integer
          description: |
            What the solve was actually given: this server's clamp, then the node's own once it reports it. Never zero: zero means every core to the solver, which is about 0.9 GB of memory each.
        time_limit_seconds:
          type: number
          format: double
          minimum: 0
          maximum: 86400
          description: Search limit granted by the node, or the requested limit while pending.
        improve:
          type: boolean
          description: True when this run improves the source timetable.
        stall_stop_seconds:
          type: number
          format: double
          minimum: 0
          maximum: 86400
          description: Stop after this many seconds without a better timetable; zero disables this stop.
        peak_rss_bytes:
          type: integer
          format: int64
          description: |
            The solver process's peak memory, from the node's final frame. Absent when no final frame came or the node did not report it.
        cpu_seconds:
          type: number
          format: double
          description: |
            The solver process's CPU time, from the node's final frame. Absent when no final frame came or the node did not report it.
        quality:
          type: number
          format: double
          description: |
            The node's own rating of the schedule, 0 to 100, where 100 is pristine. Absent when the solve produced nothing. This is the number to show a person and to compare two runs of one school by. It is **not** the search objective, which moves with the rule weights and cannot rank two schedules built under different rules.
        verdict:
          type: string
          description: |
            The node's one-glance tier over errors and warnings, as its own enum name. Absent when there is nothing to judge.
        explanation:
          type: string
          description: |
            Why the model could not be satisfied, in the node's own words: the named inputs that cannot all hold, such as a teacher's availability against the lessons assigned to them. Present only after a solve the node proved infeasible, and worth showing prominently: it is the difference between a school knowing what to change and a school retrying the same file.
        detail:
          type: string
          description: |
            What the node or the solver last said, or why the stream ended. English free text for an operator; a client words `reason` instead.
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          description: Absent while the job is still pending.
        finished_at:
          type: string
          format: date-time
          description: Absent while the job is still running.
    JobStatus:
      type: string
      enum:
        - pending
        - running
        - done
        - failed
        - cancelled
      description: |
        Pending and running count against a node's concurrency; the rest are terminal. A clean stream close is not success, so `done` means a timetable arrived and was kept as a result, and `failed` covers a solve that ran correctly and found nothing, and one whose node failed, stopped answering or ran past the deadline. That second kind keeps the best timetable received, when it had one. A `cancelled` solve keeps the timetable it had, when it had one.
    JobCreate:
      type: object
      additionalProperties: false
      description: |
        Exactly one of `plan_version` and `result_id` names the file the solve reads. At most one of `builtin_rule_profile` and `school_rule_profile_id` names a rule profile; with one, the profile's rules replace every rule of the plan for this solve, and without either the solve uses the plan's own rules.
      properties:
        node_id:
          type: string
          pattern: ^[0-9]{1,19}$
          description: |
            Which paired node to dispatch to. Absent lets the server pick: the node paired earliest that is not revoked, has a free slot and answers.
        plan_version:
          type: integer
          format: int64
          minimum: 1
          description: The version of the plan to solve.
        result_id:
          type: string
          pattern: ^[0-9]{1,19}$
          description: |
            A result of the plan to solve instead of a version: the solve reads the result's own document, its school and its timetable. One in Trash is not found.
        total_time_seconds:
          type: number
          minimum: 1
          maximum: 86400
          description: |
            The search budget. The call's own deadline is computed from it with room for the solver's work after the search, so this is the only time value a caller sets.
        stall_stop_seconds:
          type: number
          format: double
          minimum: 0
          maximum: 86400
          description: Stop after this many seconds without a strictly better timetable once one exists; zero or absent disables this stop.
        num_workers:
          type: integer
          minimum: 0
          maximum: 64
          description: |
            At most this many workers. The node's `workers_per_solve` is the most a solve on it gets, and what it gets when this is absent or zero; the node's free memory can lower it. Zero is never passed through, because zero means all cores to the solver.
        ignore_previous_placements:
          type: boolean
          description: |
            True solves from scratch. False improves on the timetable of the file the solve reads (the version or the result): each lesson starts where that timetable places it, and the solve never ends worse than it. Absent is false. Refused with `solve.incompleteBaseline` (details `Unplaced` and `Lessons`) unless that timetable places every lesson; a file with no timetable places none.
        builtin_rule_profile:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          maxLength: 64
          description: |
            A built-in profile to solve with, by the name getRuleCatalogue lists (`default` is the solver's defaults). The node refuses a name it does not know when the solve starts.
        school_rule_profile_id:
          type: string
          pattern: ^[0-9]{1,19}$
          description: |
            A school profile to solve with (listRuleProfiles). The solve is sent its overrides as they are now; a later edit or delete does not change this solve or what its job and result record. An unknown id is not found.
    JobList:
      type: object
      required:
        - items
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Job'
    JobPage:
      type: object
      required:
        - items
        - page
        - limit
        - total
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        page:
          type: integer
          description: The page this response is, echoed back after clamping.
        limit:
          type: integer
          description: The page size applied, which may be lower than the one asked for.
        total:
          type: integer
          description: How many jobs match the filter in total, for the page count and a badge.
    JobPreview:
      type: object
      required:
        - job_id
        - plan_version
        - received
      additionalProperties: false
      description: |
        The best timetable a running solve has sent so far. It is kept only while the job runs; once the job ends the timetable is in the project's results.
      properties:
        job_id:
          type: string
        plan_version:
          type: integer
          format: int64
          description: |
            The version the solve reads. Draw the timetable over that version's school, never over the main file being edited.
        source_result_id:
          type: string
          description: |
            The result the solve reads instead of a version, when it reads one. Draw the timetable over that result's document then: its school is `plan_version`'s, and that version may already be gone.
        received:
          type: integer
          minimum: 0
          description: |
            How many timetables this server has received from the solve. The count to show a person; `solutions_found` on the event stream also counts timetables that never arrived.
        quality:
          type: number
          format: double
          description: The node's 0-100 rating of this timetable. Absent until one arrives.
        verdict:
          type: string
          description: The node's tier over this timetable's errors and warnings, as its enum name.
        lessons:
          type: array
          description: The timetable, one entry per placed lesson. Absent until one arrives.
          items:
            $ref: '#/components/schemas/PreviewLesson'
    PreviewLesson:
      type: object
      required:
        - lesson_id
        - day_id
        - start_period
      additionalProperties: false
      properties:
        lesson_id:
          type: integer
          format: int64
        day_id:
          type: integer
          format: int64
        start_period:
          type: integer
          format: int64
        room_id:
          type: integer
          format: int64
          description: Absent when the lesson has no room.
    Starter:
      type: object
      required:
        - id
        - name
      additionalProperties: false
      description: |
        Who started a solve, uploaded a result solved on a device, or created a school rule profile.
      properties:
        id:
          type: string
          description: The identity id, which says whether a solve or a profile is the caller's own.
        name:
          type: string
          description: |
            The display name at that time: the account's name, or its username when it has none.
    JobEvent:
      type: object
      required:
        - job_id
        - terminal
      additionalProperties: false
      description: |
        One frame of the nudge stream. Every field is a hint for an indicator: the stream is lossy by design, so a client that will act on a value reads the job instead.
        A field with nothing to say is absent, so the terminal frame carries only `job_id`, `job_status`, `terminal`, and `message` and `received` when they have a value.
      properties:
        job_id:
          type: string
        phase:
          type: string
          description: The solver's phase, as its own enum name.
        status:
          type: string
          description: |
            The solver's status enum on this frame, and only ever that. Not evidence of anything on a progress frame, where it is set unconditionally. Absent on the terminal frame, which carries no solver frame of its own.
        job_status:
          description: |
            The job's own status, and only on the terminal frame. It is a different vocabulary from `status` above, which is why it is a different field.
          $ref: '#/components/schemas/JobStatus'
        stage:
          type: string
          description: What the search is doing right now, for a live indicator.
        wall_seconds:
          type: number
        objective:
          type: integer
          format: int64
        solutions_found:
          type: integer
          description: |
            What the search found, which can exceed what arrived here: an invalid solution is dropped before it is written to the stream. Never shown as a count; `received` is.
        received:
          type: integer
          description: |
            How many timetables this server has received from the solve so far, the same count as JobPreview.received.
        message:
          type: string
        terminal:
          type: boolean
          description: |
            The job is over and no further frame is coming, so a client can stop waiting without a timeout.
    SolveResult:
      type: object
      required:
        - id
        - plan_id
        - source_version
        - object_key
        - size_bytes
        - created_at
        - started_by
        - pinned
      additionalProperties: false
      properties:
        id:
          type: string
          description: Decimal string, because a 64-bit id does not survive a JSON number.
        plan_id:
          type: string
        job_id:
          type: string
          description: |
            The solve on this server's nodes that found it. Absent for a result solved on a device.
        device:
          type: string
          minLength: 1
          maxLength: 100
          description: |
            The name of the device that solved it on its own node and uploaded it (uploadResult). Absent for a solve on this server's nodes.
        source_version:
          type: integer
          format: int64
          minimum: 1
          description: |
            The version of the main file whose school data the result carries: the version the solve read, or the source version of the result it read. The main file may have moved on since.
        object_key:
          type: string
          description: Where the document sits in object storage, content-addressed.
        size_bytes:
          type: integer
          format: int64
          description: The compressed size of the stored document.
        created_at:
          type: string
          format: date-time
          description: |
            When its solve ended: when a server solve kept it, or the device's `solved_at`.
        started_by:
          $ref: '#/components/schemas/Starter'
        rule_profile:
          $ref: '#/components/schemas/SolveRuleProfile'
        quality:
          type: number
          format: double
          description: |
            The node's 0-100 rating of the timetable, where 100 is pristine. Absent when the node sent no score with it.
        verdict:
          type: string
          description: The node's tier over the timetable's errors and warnings, as its enum name.
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: The name someone gave it. Absent until then.
        pinned:
          type: boolean
          description: |
            A pinned result is never removed by the results cap. Only deleting it (to Trash) removes it.
    SolveResultList:
      type: object
      required:
        - items
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SolveResult'
    SolveResultUpdate:
      type: object
      additionalProperties: false
      description: A field that is absent is left as it is.
      properties:
        name:
          type: string
          maxLength: 200
          description: |
            Trimmed. An empty string removes the name. Longer than 200 letters is refused with `name: too_long`.
        pinned:
          type: boolean
    ServerSettingName:
      type: string
      enum:
        - public_addresses
        - maximum_upload_bytes
        - rate_limit_per_minute
        - trash_days
        - backups_keep
        - results_keep
      description: One of the settings on Backend > Server, by its wire name.
    ServerSettings:
      type: object
      required:
        - public_addresses
        - maximum_upload_bytes
        - rate_limit_per_minute
        - trash_days
        - backups_keep
        - results_keep
        - applies
        - restart_pending
      additionalProperties: false
      description: |
        The server settings an administrator changes while the server runs, as stored in the settings file beside the server's configuration file. A setting whose `applies` is `restart` is stored at once and takes effect when the server next starts; until then `restart_pending` names it and the server keeps the value it started with.
      properties:
        public_addresses:
          type: array
          maxItems: 16
          items:
            type: string
            maxLength: 255
          description: |
            The other addresses this server answers on, published at /api/info as `addresses`. Each is an absolute http or https URL with a host and no user, query or fragment, such as `https://plan.szkola.edu.pl`.
          examples:
            - - http://192.0.2.10:8833
        maximum_upload_bytes:
          type: integer
          format: int64
          minimum: 1024
          maximum: 268435456
          description: |
            The largest upload the server takes: a whole request on the upload routes, and each part of it. Over it, 413 `error.requestTooLarge`.
        rate_limit_per_minute:
          type: integer
          minimum: 0
          maximum: 100000
          description: |
            Requests one client address may make to /api/v1 per minute. 0 turns the limit off. The sign-in proxy has its own limit, set in the configuration file.
        trash_days:
          type: integer
          minimum: 1
          maximum: 3650
          description: |
            How long a deleted project, checkpoint or result stays in Trash. Every removal date moves with it, including those already in Trash.
        backups_keep:
          type: integer
          minimum: 1
          maximum: 10000
          description: |
            The backups cap of a project without its own: how many older versions of the main file Backups/ keeps, checkpoints not counted. A lower cap removes nothing until the project's next version, or until Storage trims the backups.
        results_keep:
          type: integer
          minimum: 1
          maximum: 10000
          description: |
            The results cap of a project without its own: how many unpinned results it keeps. A lower cap removes nothing until the project's next result.
        applies:
          $ref: '#/components/schemas/ServerSettingsApplies'
        restart_pending:
          type: array
          items:
            $ref: '#/components/schemas/ServerSettingName'
          description: |
            The settings whose stored value is not in force yet because they apply at a restart. Empty when the server runs with every stored value.
    ServerSettingsApplies:
      type: object
      required:
        - public_addresses
        - maximum_upload_bytes
        - rate_limit_per_minute
        - trash_days
        - backups_keep
        - results_keep
      additionalProperties: false
      description: When a change to each setting takes effect.
      properties:
        public_addresses:
          $ref: '#/components/schemas/SettingApplies'
        maximum_upload_bytes:
          $ref: '#/components/schemas/SettingApplies'
        rate_limit_per_minute:
          $ref: '#/components/schemas/SettingApplies'
        trash_days:
          $ref: '#/components/schemas/SettingApplies'
        backups_keep:
          $ref: '#/components/schemas/SettingApplies'
        results_keep:
          $ref: '#/components/schemas/SettingApplies'
    ServerSettingsUpdate:
      type: object
      additionalProperties: false
      description: |
        The settings to change. An absent field keeps its value; an empty body is refused as `body: empty`. A value outside its range is refused with that field and `invalid`. An address is refused by its position, `public_addresses[N]`, with `invalid` or `duplicate`; more than 16 with `public_addresses: too_many`. Addresses are trimmed, and `[]` removes every one.
      properties:
        public_addresses:
          type: array
          items:
            type: string
        maximum_upload_bytes:
          type: integer
          format: int64
          minimum: 1024
          maximum: 268435456
        rate_limit_per_minute:
          type: integer
          minimum: 0
          maximum: 100000
        trash_days:
          type: integer
          minimum: 1
          maximum: 3650
        backups_keep:
          type: integer
          minimum: 1
          maximum: 10000
        results_keep:
          type: integer
          minimum: 1
          maximum: 10000
    BuildVersion:
      type: object
      required:
        - version
        - commit
        - build_time
      additionalProperties: false
      description: |
        What this server binary is. An empty field means the build did not record it, as in a development run.
      properties:
        version:
          type: string
          examples:
            - 0.1.0
        commit:
          type: string
          examples:
            - '0429258'
        build_time:
          type: string
          description: UTC, as the build wrote it.
          examples:
            - '2026-09-27T08:36:58Z'
    Readiness:
      type: object
      required:
        - ready
      additionalProperties: false
      properties:
        ready:
          type: boolean
          description: Always true; a server that is not ready answers 503.
    StorageUsage:
      type: object
      required:
        - projects
        - stored_bytes
        - stored_objects
        - waiting_objects
      additionalProperties: false
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectStorage'
          description: Every owner's projects, those in Trash included, largest first.
        stored_bytes:
          type: integer
          format: int64
          description: Every stored object that a version or a result names, each counted once.
        stored_objects:
          type: integer
          description: How many objects `stored_bytes` counts.
        waiting_objects:
          type: integer
          description: |
            Objects nothing names any more, waiting for the clean-up that deletes them. It runs every hour and deletes an object once it has waited an hour.
    ProjectStorage:
      type: object
      required:
        - plan_id
        - name
        - owner
        - main_file
        - backups
        - results
        - trash
      additionalProperties: false
      properties:
        plan_id:
          type: string
          description: The plan, as a decimal string like Plan.id.
        name:
          type: string
        owner:
          $ref: '#/components/schemas/Owner'
        deleted_at:
          type: string
          format: date-time
          description: |
            Present when the whole project is in Trash; then everything it holds goes when Trash is emptied.
        main_file:
          $ref: '#/components/schemas/StoredFiles'
        backups:
          $ref: '#/components/schemas/StoredFiles'
        results:
          $ref: '#/components/schemas/StoredFiles'
        trash:
          $ref: '#/components/schemas/StoredFiles'
    StoredFiles:
      type: object
      required:
        - count
        - bytes
      additionalProperties: false
      description: |
        A part of a project. `main_file` is the newest version. `backups` are the older versions, named checkpoints included and checkpoints in Trash not. `results` are the results not in Trash. `trash` is the checkpoints and results in Trash; a project in Trash keeps its other parts where they are and says so with `deleted_at`.
      properties:
        count:
          type: integer
        bytes:
          type: integer
          format: int64
    Owner:
      type: object
      required:
        - id
      additionalProperties: false
      description: The account that owns a project.
      properties:
        id:
          type: string
          description: Kratos's identity id.
        name:
          type: string
          description: |
            The account's name, or its username when it has none. Absent when the account is gone or Kratos did not answer.
    TrashEmptied:
      type: object
      required:
        - projects
        - checkpoints
        - results
      additionalProperties: false
      description: |
        What left Trash for good. Their stored objects wait for the hourly clean-up like any other removed object.
      properties:
        projects:
          type: integer
        checkpoints:
          type: integer
        results:
          type: integer
    BackupsTrimmed:
      type: object
      required:
        - versions
      additionalProperties: false
      properties:
        versions:
          type: integer
          description: How many older versions were removed for good.
    ObjectsSwept:
      type: object
      required:
        - deleted
        - waiting
      additionalProperties: false
      properties:
        deleted:
          type: integer
          description: How many objects this clean-up deleted.
        waiting:
          type: integer
          description: |
            How many are still waiting: an object is deleted only after it has waited an hour, which covers an upload that stores its object before the row naming it.
    LogLevel:
      type: string
      enum:
        - debug
        - info
        - warn
        - error
    LogLine:
      type: object
      required:
        - time
        - level
        - event
        - message
      additionalProperties: false
      properties:
        time:
          type: string
          format: date-time
        level:
          $ref: '#/components/schemas/LogLevel'
        event:
          type: string
          description: |
            The line's stable event id, the same in every language, such as `logs.serverStarted`.
          examples:
            - logs.serverStarted
        message:
          type: string
          description: The line's sentence, in the language asked for.
        fields:
          type: object
          additionalProperties:
            type: string
          description: |
            The line's values by name. A value that could be a secret (a password, a token, a pairing link) reads `[redacted]`.
    LogLines:
      type: object
      required:
        - items
        - capacity
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LogLine'
          description: Newest first.
        capacity:
          type: integer
          description: |
            How many recent lines the server holds, of every level it logs. Older ones are only in the server's own log.
    AuditKind:
      type: string
      enum:
        - project
        - user
        - node
        - setting
        - storage
      description: What an entry changed.
    AuditAction:
      type: string
      enum:
        - project.created
        - project.renamed
        - project.changed
        - project.deleted
        - project.restored
        - project.transferred
        - user.created
        - user.changed
        - user.passwordReset
        - user.signedOut
        - user.sessionEnded
        - node.paired
        - node.changed
        - node.revoked
        - setting.changed
        - storage.trashEmptied
        - storage.backupsTrimmed
        - storage.swept
      description: |
        What was done, with the `details` each carries: `project.created` (`source`: `new`, `import`, `demo` or `fork`; a fork also carries `origin`, the origin plan's id, `origin_name` and `version`, the origin's version it copied); `project.renamed` (`from`, `to`); `project.changed` (each changed field of `school_year`, `backups_keep`, `results_keep` with its new value; a cap of 0 follows the server's); `project.deleted` (to Trash) and `project.restored` (from Trash), none; `project.transferred` (`from_id`, `from`, `to_id`, `to`: the previous and the new owner's identity ids and names; a name is empty when Kratos did not know it); `user.created` (`role`); `user.changed` (`role`, `active` as `true` or `false`, as changed); `user.passwordReset`, `user.signedOut` (every session), none; `user.sessionEnded` (`session`, the session id); `node.paired` (`address`); `node.changed` (each changed field of `label`, `solves_at_once`, `workers_per_solve` with its new value); `node.revoked`, none; `setting.changed` (each changed setting with its new value; a list is comma-separated), target id `lockout` or `server`; `storage.trashEmptied` (`projects`, `checkpoints`, `results`); `storage.backupsTrimmed` (`versions`); `storage.swept` (`deleted`, `waiting`).
    AuditEntry:
      type: object
      required:
        - id
        - at
        - actor
        - action
        - target
        - details
      additionalProperties: false
      properties:
        id:
          type: string
          description: A decimal string, like Plan.id.
        at:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/AuditActor'
        action:
          $ref: '#/components/schemas/AuditAction'
        target:
          $ref: '#/components/schemas/AuditTarget'
        details:
          type: object
          additionalProperties:
            type: string
    AuditActor:
      type: object
      required:
        - id
      additionalProperties: false
      description: Who did it, as the account was named then.
      properties:
        id:
          type: string
          description: Kratos's identity id.
        name:
          type: string
          description: The account's name, or its username when it had none. Absent when neither was known.
    AuditTarget:
      type: object
      required:
        - kind
        - id
      additionalProperties: false
      description: What it was done to, as it was named then.
      properties:
        kind:
          $ref: '#/components/schemas/AuditKind'
        id:
          type: string
          description: |
            The plan id, the identity id, the node id, `lockout` or `server` for a setting, or `server` for storage.
        name:
          type: string
          description: The project's name, the username or the node's label then.
    AuditPage:
      type: object
      required:
        - items
        - page
        - limit
        - total
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
          description: Newest first.
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
          description: Every matching entry, not the page.
    ExportFormat:
      type: string
      description: |
        A file the server builds from a version or a result. `goptivum.gpf` holds the school data and the timetable; `optivum.html` holds the timetable's pages, so it needs a timetable.
      enum:
        - goptivum.gpf
        - optivum.html
    SolveResultUploadProfile:
      type: object
      required:
        - name
      additionalProperties: false
      description: |
        The rule profile the solve used in place of the plan's own rules, as the device sent it to its node; absent when it used the plan's rules. A built-in is named alone. A school profile carries its id and the overrides the solve was sent, which checkResult sends again whatever the profile became since. Anything else, including JSON that does not read as this object, is refused with `rule_profile: invalid`.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            A built-in's name (`^[a-z][a-z0-9_]{0,63}$`) when `id` is absent, otherwise the school profile's name when the solve started.
        id:
          type: string
          pattern: ^[0-9]{1,19}$
          description: The school profile's id; absent for a built-in.
        overrides:
          type: array
          maxItems: 64
          description: |
            The school profile's overrides as the solve was sent them, at most one per rule. Required with `id`, refused without it.
          items:
            $ref: '#/components/schemas/RuleOverride'
    SolveResultUpload:
      type: object
      required:
        - document
        - source_version
        - upload_key
        - device
      additionalProperties: false
      properties:
        document:
          type: string
          format: binary
          description: |
            The encoded document: protobuf compressed with zstd, as uploadVersion takes it, with a timetable. Absent is refused with `document: required`, bytes that are not a document with `document: unreadable`, a document without a timetable with `document: no_timetable`.
        source_version:
          type: integer
          format: int64
          minimum: 1
          description: |
            The version of the main file whose school data the result carries. It may have been removed by the backups cap since. Absent is refused with `source_version: required`, a value below 1 or not a number with `source_version: invalid`, a version above the plan's newest with `source_version: unknown`.
        upload_key:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,64}$
          description: |
            Random, chosen by the device for this one result and sent again unchanged on a retry. Stored on the result, unique per plan. Absent is refused with `upload_key: required`, a value outside the pattern with `upload_key: invalid`, and a key already stored with another document or source version with `upload_key: reused`.
        device:
          type: string
          maxLength: 100
          description: |
            The name of the device that solved it. Trimmed; blank is refused with `device: required`, longer than 100 letters with `device: too_long`.
        solved_at:
          type: string
          format: date-time
          description: |
            When the solve ended on the device; the result's `created_at`. Absent, or later than now on this server's clock, is now. A value that is not a date and time is refused with `solved_at: invalid`.
        quality:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: |
            The node's 0-100 rating of the timetable. Absent when the node sent no score. Outside 0-100 or not a number is refused with `quality: invalid`.
        verdict:
          type: string
          enum:
            - TIER_PRISTINE
            - TIER_WARNINGS
            - TIER_ERRORS
          description: |
            The node's tier over the timetable's errors and warnings. Any other value is refused with `verdict: invalid`.
        rule_profile:
          $ref: '#/components/schemas/SolveResultUploadProfile'
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 1-indexed. Absent means 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Absent means the endpoint default.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 25
    Query:
      name: q
      in: query
      required: false
      description: |
        Free-text search over a plan's name and school year.
      schema:
        type: string
    PlanID:
      name: planId
      in: path
      required: true
      description: Decimal string, because a 64-bit id does not survive a JSON number.
      schema:
        type: string
        pattern: ^[0-9]{1,19}$
    VersionNumber:
      name: version
      in: path
      required: true
      description: 1-indexed position in the plan's timeline.
      schema:
        type: integer
        format: int64
        minimum: 1
    RulesVersion:
      name: rules_version
      in: query
      required: false
      description: Judge using only the rules of this version in the same plan. Omitted keeps the checked file's rules or saved solve profile.
      schema:
        type: integer
        format: int64
        minimum: 1
    ExportFormat:
      name: format
      in: path
      required: true
      description: |
        The file to build, named as the import registry names the format: `goptivum.gpf` is Goptivum's own project file, `optivum.html` a zipped VULCAN-style Optivum HTML export.
      schema:
        $ref: '#/components/schemas/ExportFormat'
    ResultID:
      name: resultId
      in: path
      required: true
      description: Decimal string, same reason as a plan id.
      schema:
        type: string
        pattern: ^[0-9]{1,19}$
    RuleProfileID:
      name: profileId
      in: path
      required: true
      description: Decimal string, same reason as a plan id.
      schema:
        type: string
        pattern: ^[0-9]{1,19}$
    UserID:
      name: userId
      in: path
      required: true
      description: Kratos's identity id, a UUID.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    SessionID:
      name: sessionId
      in: path
      required: true
      description: Kratos's session id, a UUID.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    NodeID:
      name: nodeId
      in: path
      required: true
      description: Decimal string, same reason as a plan id.
      schema:
        type: string
        pattern: ^[0-9]{1,19}$
    JobID:
      name: jobId
      in: path
      required: true
      description: Decimal string, same reason as a plan id.
      schema:
        type: string
        pattern: ^[0-9]{1,19}$
  responses:
    BadRequest:
      description: |
        The request could not be read: a query or path value that is not the type the contract says (`page=abc`, a version that is not a number), a JSON body that does not parse, or a multipart body without a boundary. Message `error.badRequest`. Values that parse but are out of range are clamped or answered with 422, never with this.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No session, or a session Kratos does not recognise.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: |
        The session is valid and the account may not do this. Three messages: `auth.passwordChangeRequired`, an account still carrying the first-sign-in flag, which every route refuses until the password is changed through the Kratos settings flow at `/kratos/` (that flow is deliberately outside this group, so it stays reachable while everything else is refused); `plans.notYours`, a change to a plan the account does not own: renaming, deleting or restoring it, uploading a version, a checkpoint or result change, starting or cancelling a solve (everyone reads every plan, and may fork it); and `rules.profileNotYours`, a school rule profile that only the account that created it and administrators may change or delete. Branch on `message`, not on the status.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: |
        A dependency is unreachable. Never an anonymous answer: an unreachable Kratos is an outage, not a missing session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooLarge:
      description: |
        The upload, or one part of it, is over the size this server accepts (the `maximum_upload_bytes` server setting, as it was when the server started). Message `error.requestTooLarge`. When a handler refused it, `details.Limit` is that size in bytes, as a decimal string. A body whose declared length is already over it is refused before any handler reads it and carries no details; `/api/info` names the size as `maximum_upload_bytes` in every case, so a client can check a file before sending it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Validation:
      description: |
        The request is well-formed but the values are not usable.
        `details` carries one of two shapes here, and the `message` says which. A generic `error.validation` carries field-level codes keyed by field path (`file: unreadable`). A specific key such as `gpf.wrongRealm` carries the parameters that key needs to render (`File: szkola.edu.pl`, `Local: liceum.pl`), because a refusal the server worded carefully is useless if the client cannot fill in the blanks.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: |
        No such thing. A plan in Trash is not found everywhere except its owner's Trash listing and restore.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedFormat:
      description: |
        No importer recognises the file: it is not a .pla, a .gpf or an Optivum HTML export, whatever its name says. Code `unsupported_format`, message `import.unsupportedFormat`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
