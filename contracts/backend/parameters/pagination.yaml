# contracts/backend/parameters/pagination.yaml
#
# Query parameters every list endpoint takes. A value that parses but is out of
# range is clamped rather than refused: a page of 0 or a limit of 10000 is
# answerable, and refusing it turns a stale bookmark into a bug report. A value
# that is not an integer at all is a 400 envelope.

Page:
  name: page
  in: query
  required: false
  description: 1-indexed. Absent means 1.
  schema:
    type: integer
    minimum: 1
    default: 1

Limit:
  name: limit
  in: query
  required: false
  description: Page size. Absent means the endpoint default.
  schema:
    type: integer
    minimum: 1
    maximum: 200
    default: 25

Query:
  name: q
  in: query
  required: false
  description: >
    Free-text search over a plan's name and school year.
  schema:
    type: string
