# contracts/backend/schemas/version.yaml
#
# One immutable document in a plan's timeline. There is no locking: an upload
# names the version it came from, and a stale parent is refused with a conflict
# that carries the current version so a client can say who saved first.

Version:
  type: object
  required: [plan_id, version, object_key, size_bytes, created_at, created_by]
  additionalProperties: false
  properties:
    plan_id:
      type: string
      description: Decimal string, as on Plan.
    version:
      type: integer
      format: int64
      minimum: 1
    parent:
      type: integer
      format: int64
      description: >
        The version this one was derived from. Absent on version 1, which is
        created with the plan.
    object_key:
      type: string
      description: >
        Where the document sits in object storage, content-addressed. Clients
        download through this API and never reach into the store, which is what
        keeps validation, id allocation and version checks in one place.
    size_bytes:
      type: integer
      format: int64
      description: The compressed size of the stored document.
    created_at:
      type: string
      format: date-time
    created_by:
      type: string
      description: The identity that uploaded it.
    valid_from:
      type: string
      format: date
      description: >
        The first day this schedule applies. A school's timetable changes
        mid-year, so one plan holds a September schedule and a February one.
    valid_to:
      type: string
      format: date
      description: The last day this schedule applies. Absent means open-ended.
    summary:
      $ref: './version.yaml#/VersionSummary'
    checkpoint:
      type: string
      minLength: 1
      maxLength: 200
      description: >
        The checkpoint name when this version is a named checkpoint. Absent
        otherwise, and while the checkpoint is in Trash.

VersionSummary:
  type: object
  description: >
    What changed from the parent, as counts per edit kind and then per kind of
    thing, such as `{"added":{"teacher":3},"moved":{"lesson":2}}`. Never prose:
    every reader words it in its own language. Names are lower camel case
    (letters and digits, starting with a letter, at most 32), counts are 1 to
    1000000, and the whole object is at most 4096 bytes of JSON. Absent on a
    version whose uploader sent none.
  additionalProperties:
    type: object
    additionalProperties:
      type: integer
      minimum: 1
      maximum: 1000000

VersionList:
  type: object
  required: [items]
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: './version.yaml#/Version'

VersionUpload:
  type: object
  required: [document, parent, upload_key]
  additionalProperties: false
  properties:
    document:
      type: string
      format: binary
      description: The encoded document.
    parent:
      type: integer
      format: int64
      minimum: 1
      description: >
        The version this was derived from. Absent or below 1 is refused with
        `parent: required` or `parent: invalid`.
    upload_key:
      type: string
      pattern: '^[A-Za-z0-9_-]{16,64}$'
      description: >
        Random, chosen by the client for this one upload and sent again
        unchanged on a retry. Stored on the version, unique per plan. Absent is
        refused with `upload_key: required`, a value outside the pattern with
        `upload_key: invalid`, and a key already stored with another document
        or parent with `upload_key: reused`.
    summary:
      $ref: './version.yaml#/VersionSummary'
    valid_from:
      type: string
      format: date
      description: >
        Absent keeps the parent's date, an empty value clears it. A value that
        is not a date is refused with `valid_from: invalid`.
    valid_to:
      type: string
      format: date
      description: >
        Absent keeps the parent's date, an empty value clears it. A value that
        is not a date is refused with `valid_to: invalid`.

CheckpointName:
  type: object
  required: [name]
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
      description: >
        Trimmed. Blank is refused with `name: required`, longer than 200
        letters with `name: too_long`.
      examples: ['tydzień i klasy']

Conflict:
  type: object
  required: [code, message, current_version]
  additionalProperties: false
  properties:
    code:
      type: string
      enum: [conflict]
    message:
      type: string
      description: i18n key the client resolves.
    current_version:
      type: integer
      format: int64
      description: >
        The version the plan is actually at. The client shows "someone saved
        first, here is their version" instead of overwriting their work.
