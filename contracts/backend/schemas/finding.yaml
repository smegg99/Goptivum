# contracts/backend/schemas/finding.yaml
#
# What an import did not map. An import that maps most of a school returns the
# school plus these, because a file that fails wholesale teaches a secretary
# nothing. The client localises from kind and the entity references, never
# from a prose string, so there is no prose string here.

Finding:
  type: object
  required: [kind, severity, count]
  additionalProperties: false
  properties:
    kind:
      type: string
      pattern: '^[a-z][a-z0-9_]*$'
      description: Stable, localisable identity of the finding.
      examples: [unmapped_element, unknown_reference, lesson_dropped]
    severity:
      type: string
      enum: [info, warning, error]
      description: >
        error means data was lost: a lesson the file describes did not survive
        the import.
    entities:
      type: array
      description: The entities involved, for a client that highlights them.
      items:
        $ref: './finding.yaml#/EntityRef'
    count:
      type: integer
      minimum: 1
      description: >
        How many occurrences this one finding stands for. Findings that are
        the same kind, severity and entities are merged into one and their
        counts added, and a reader that tallied a bulk loss (80 lessons with
        no placement) counts each item, so the same fact is listed once. 1
        for a single occurrence.

EntityRef:
  type: object
  required: [kind, id]
  additionalProperties: false
  properties:
    kind:
      type: string
      enum: [division, group, teacher, room, subject, year, external_block, split, link]
      description: >
        division is a class. split (a class's division into groups) and link
        (a lesson link) appear only in check findings.
    id:
      type: integer
      description: The entity id inside the document.
