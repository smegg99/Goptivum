# contracts/backend/openapi.yaml
#
# OpenAPI 3.1, but deliberately inside the subset kin-openapi parses, because
# oapi-codegen warns on 3.1 and proceeds: no type arrays, no const, no numeric
# exclusiveMinimum, no $ref siblings.
#
# This root file only aggregates. Endpoints live in paths/, reusable shapes in
# schemas/, query and path parameters in parameters/, shared failures in
# responses/. Edit the small files; dist/openapi.yaml is generated by
# `just contracts` and is what the Go generator and every client read.
openapi: 3.1.0
info:
  title: Goptivum Server API
  description: >
    The contract between Goptivum Desktop and Goptivum Server. A plan is a
    document, not rows: the desktop downloads one whole, edits it in memory and
    uploads a new version, so there is no per-entity endpoint here and no
    partial update.
  version: 0.1.0
  license:
    name: MIT
    url: https://opensource.org/license/mit/
servers:
  - url: /api
    description: >
      Every path below is relative to it. /info is unversioned, because a
      client reads it to learn the version; everything else carries its
      version in the path.
# Every operation needs a signed-in session unless it opts out with its own
# `security: []`.
security:
  - sessionToken: []
tags:
  - name: discovery
    description: What a client reads before it has a session or knows the version.
  - name: plans
    description: >
      The school's plans. A plan is one project: every signed-in account reads
      and forks every one, and only its owner changes it.
  - name: trash
    description: >
      What an owner deleted, kept for the server's `trash_days` and restorable until
      then. Each account's Trash holds only what it owns.
  - name: versions
    description: One plan's timeline of documents.
  - name: results
    description: The timetables a plan's solves kept, each a whole document.
  - name: check
    description: What a solve's input checks say about a version or a result, without solving it.
  - name: rules
    description: >
      The rules a plan may set, as the solver defines them, and the rule
      profiles the school shares.
  - name: import
    description: Turning a school's own file into a plan.
  - name: export
    description: >
      A version or a result as a file for someone else: a .gpf or an Optivum
      HTML export, built once and kept.
  - name: account
    description: >
      What one signed-in account keeps on the server for itself: how its
      Library is arranged.
  - name: users
    description: The school's accounts and their sessions. Administrator-only.
  - name: security
    description: >
      How signing in is protected: the sign-in lockout and Kratos's password
      rules. Administrator-only.
  - name: nodes
    description: The solving nodes this deployment trusts. Administrator-only.
  - name: jobs
    description: Solves dispatched to a node, and their progress.
  - name: school
    description: >
      What belongs to the school rather than to one person: its own key for
      encrypted project files.
  - name: server
    description: >
      The settings an administrator changes while the server runs.
      Administrator-only.
  - name: health
    description: >
      What the server is and whether it can serve. No session needed.
  - name: storage
    description: >
      What every project stores, and emptying Trash, trimming backups and
      deleting unused objects now. Administrator-only.
  - name: logs
    description: The server's recent log lines. Administrator-only.
  - name: audit
    description: >
      Who changed which project, account, node or setting.
      Administrator-only.
