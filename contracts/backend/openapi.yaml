# contracts/backend/openapi.yaml
#
# OpenAPI 3.1, but deliberately inside the subset kin-openapi parses, because
# oapi-codegen warns on 3.1 and proceeds: no type arrays, no const, no numeric
# exclusiveMinimum, no $ref siblings.
#
# This root file only aggregates. Endpoints live in paths/, reusable shapes in
# schemas/, query and path parameters in parameters/, shared failures in
# responses/. Edit the small files; dist/openapi.yaml is generated by
# `just contracts` and is what the Go generator and every client read.
openapi: 3.1.0
info:
  title: Goptivum Server API
  description: >
    The contract between Goptivum Desktop and Goptivum Server. A plan is a
    document, not rows: the desktop downloads one whole, edits it in memory and
    uploads a new version, so there is no per-entity endpoint here and no
    partial update.
  version: 0.1.0
  license:
    name: MIT
    url: https://opensource.org/license/mit/
servers:
  - url: /api/v1
    description: The versioned API. Every path below is relative to it.
# Every operation needs a signed-in Kratos session unless it opts out with its
# own `security: []`. The session is a cookie because the clients are browser
# contexts: the Wails desktop shell renders a webview, so Kratos browser flows
# apply.
security:
  - kratosSession: []
tags:
  - name: discovery
    description: What a client reads before it has a session or knows the version.
  - name: plans
    description: The plans an owner has.
  - name: versions
    description: One plan's timeline of documents.
  - name: import
    description: Turning a school's own file into a plan.
paths:
  /info:
    $ref: './paths/info.yaml#/info'
  /plans:
    $ref: './paths/plans.yaml#/plans'
  /plans/{planId}:
    $ref: './paths/plans.yaml#/plan'
  /plans/{planId}/versions:
    $ref: './paths/versions.yaml#/versions'
  /plans/{planId}/versions/{version}:
    $ref: './paths/versions.yaml#/version'
  /import:
    $ref: './paths/import.yaml#/import'
components:
  securitySchemes:
    # Set by Ory Kratos on a successful browser login flow and sent by the
    # browser context. The server validates it against Kratos; an unreachable
    # Kratos is a 503 outage, never an anonymous session.
    kratosSession:
      type: apiKey
      in: cookie
      name: ory_kratos_session
      description: Ory Kratos browser session cookie.
  schemas:
    Error:
      $ref: './schemas/error.yaml#/Error'
    Info:
      $ref: './schemas/info.yaml#/Info'
    Plan:
      $ref: './schemas/plan.yaml#/Plan'
    PlanCreate:
      $ref: './schemas/plan.yaml#/PlanCreate'
    PlanPage:
      $ref: './schemas/plan.yaml#/PlanPage'
    Version:
      $ref: './schemas/version.yaml#/Version'
    VersionList:
      $ref: './schemas/version.yaml#/VersionList'
    VersionUpload:
      $ref: './schemas/version.yaml#/VersionUpload'
    Conflict:
      $ref: './schemas/version.yaml#/Conflict'
    Finding:
      $ref: './schemas/finding.yaml#/Finding'
    EntityRef:
      $ref: './schemas/finding.yaml#/EntityRef'
    ImportResult:
      $ref: './schemas/finding.yaml#/ImportResult'
