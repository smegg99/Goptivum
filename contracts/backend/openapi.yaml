components:
  securitySchemes:
    # The desktop's Go half is the HTTP client, never the webview, so it runs
    # Kratos's native API flow and carries the token that flow returns.
    sessionToken:
      type: http
      scheme: bearer
      description: >
        The session token Ory Kratos returns from its native API login flow.
        The server validates it against Kratos; an unreachable Kratos is a 503
        outage, never an anonymous session.
  schemas:
