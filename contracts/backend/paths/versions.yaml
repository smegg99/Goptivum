# contracts/backend/paths/versions.yaml
#
# Every signed-in account lists and downloads any live plan's versions; only
# the plan's owner uploads one, and anyone else gets 403 plans.notYours.

versions:
  parameters:
    - $ref: '../parameters/path.yaml#/PlanID'
  get:
    operationId: listVersions
    summary: The plan's version timeline, oldest first.
    description: >
      Version 1 is created with the plan. The newest version is the plan's main
      file; the older ones are its backups, and a named one is a checkpoint.
      The backups cap removes the oldest plain versions for good, so the
      numbering has gaps.
    tags: [versions]
    responses:
      '200':
        description: Every version of the plan.
        content:
          application/json:
            schema:
              $ref: '../schemas/version.yaml#/VersionList'
      '401':
        $ref: '../responses/error.yaml#/Unauthorized'
      '403':
        $ref: '../responses/error.yaml#/Forbidden'
      '404':
        $ref: '../responses/error.yaml#/NotFound'
      '503':
        $ref: '../responses/error.yaml#/Unavailable'
  post:
    operationId: uploadVersion
    summary: Upload a new version of the plan's document.
    description: >
      There is no lock. The upload names the version it was derived from, and a
      parent that is no longer the newest is refused with a conflict carrying the
      current version. Every plan is created with version 1, so the first upload
      makes version 2. The document itself is the encoded school: protobuf
      compressed with zstd, the same bytes a download returns.

      Each upload carries an `upload_key` the client chose. An upload whose key
      this plan already stored is answered with that version, 201 as the first
      time, so a retry after a lost answer never looks like a conflict. The
      same key with a different document or parent is refused with
      `upload_key: reused`.

      After a new version lands, the oldest versions beyond the plan's backups
      cap are removed for good: the cap counts the versions below the newest
      that are not checkpoints (see `Plan.backups_keep`).

      The plan owner's only: anyone else gets 403 `plans.notYours` and may
      fork the plan instead.
    tags: [versions]
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: '../schemas/version.yaml#/VersionUpload'
          encoding:
            summary:
              contentType: application/json
    responses:
      '201':
        description: The version that landed.
        content:
          application/json:
            schema:
              $ref: '../schemas/version.yaml#/Version'
      '400':
        $ref: '../responses/error.yaml#/BadRequest'
      '401':
        $ref: '../responses/error.yaml#/Unauthorized'
      '403':
        $ref: '../responses/error.yaml#/Forbidden'
      '404':
        $ref: '../responses/error.yaml#/NotFound'
      '409':
        description: >
          The parent is not the current version. Someone saved first. Message
          `plans.versionConflict`.
        content:
          application/json:
            schema:
              $ref: '../schemas/version.yaml#/Conflict'
      '413':
        $ref: '../responses/error.yaml#/TooLarge'
      '422':
        $ref: '../responses/error.yaml#/Validation'
      '503':
        $ref: '../responses/error.yaml#/Unavailable'

version:
  parameters:
    - $ref: '../parameters/path.yaml#/PlanID'
    - $ref: '../parameters/path.yaml#/VersionNumber'
  get:
    operationId: downloadVersion
    summary: Download one version's document.
    description: >
      The stored bytes, unchanged: protobuf compressed with zstd. The desktop
      downloads a document whole, edits it in memory and uploads a new version;
      there is no per-entity API and no partial update.
    tags: [versions]
    responses:
      '200':
        description: The document.
        content:
          application/zstd:
            schema:
              type: string
              format: binary
      '400':
        $ref: '../responses/error.yaml#/BadRequest'
      '401':
        $ref: '../responses/error.yaml#/Unauthorized'
      '403':
        $ref: '../responses/error.yaml#/Forbidden'
      '404':
        $ref: '../responses/error.yaml#/NotFound'
      '503':
        $ref: '../responses/error.yaml#/Unavailable'
