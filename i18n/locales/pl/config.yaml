postgresNeedsDSN:
  description: >-
    Configuration refused: the database driver is postgres and no connection
    string was given, so the server has nowhere to connect.
  value: baza postgres wymaga storage.database.dsn lub GOPTIVUM_DATABASE_URL
identityNeedsAdminURL:
  description: >-
    Configuration refused: an identity provider is configured without its admin
    address, so the first administrator can never be created and nobody can
    sign in.
  value: ustawiono identity.public_url, więc identity.admin_url jest wymagany
identityURLsCollide:
  description: >-
    Configuration refused: the public and admin identity addresses are the
    same. The public one is proxied, so this would publish the admin API.
  value: >-
    identity.public_url i identity.admin_url to ten sam adres; publiczny jest
    udostępniany przez proxy, a administracyjny nie może być osiągalny
documentsNeedKeys:
  description: >-
    Configuration refused: a document bucket was named without the credentials
    to reach it.
  value: >-
    magazyn dokumentów wymaga storage.documents.access_key i secret_key, lub
    GOPTIVUM_STORAGE_ACCESS_KEY i GOPTIVUM_STORAGE_SECRET_KEY
