notAFile:
  description: 'Refusal: the bytes are not a Goptivum Project File at all.'
  value: this is not a Goptivum Project File
malformed:
  description: >-
    Refusal: the file is a .gpf and cannot be read. A length past the end, a
    missing locator, a chunk claiming more than is there.
  value: this file is damaged and cannot be read
unsupportedVersion:
  description: >-
    Refusal: the file was written by a newer version of Goptivum than this one
    knows how to read.
  value: >-
    this file was written by a newer version of Goptivum (format {{.Found}}, and
    this one reads up to {{.Known}})
unsupportedAlgorithm:
  description: >-
    Refusal: the file requires something this reader does not understand, so
    opening it would mean guessing at its contents.
  value: this file needs something this version of Goptivum does not understand
wrongRealm:
  description: >-
    Refusal: the file belongs to a different school. The whole reason the header
    is plaintext is so this can be said instead of failing blank.
  value: this file belongs to {{.File}} and you are signed in to {{.Local}}
passwordRequired:
  description: 'Refusal: the file is protected by a password and none was given.'
  value: this file needs a password
wrongPassword:
  description: 'Refusal: the password given does not open the file.'
  value: that password does not open this file
identityRequired:
  description: >-
    Refusal: the file is encrypted to a key this server does not hold, usually
    because it belongs to another school.
  value: this file needs a key this server does not have
